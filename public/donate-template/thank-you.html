<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขอบคุณที่เลี้ยงกาแฟ!</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css?v=20260717_6">
</head>
<body>
  <!-- Glowing Background Blur Orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="container">
    <div class="step active">
      <div class="card glass-card thank-you">
        <div class="header">
          <img id="profileImage" class="glowing-avatar" alt="Profile" width="190" height="190" style="display: none;">
          <h1 id="thankYouHeader">ขอบคุณมากครับ!</h1>
          <p id="thankYouSubtitle" class="subtitle">สำหรับการสนับสนุนของคุณ<br>ทุกบาททุกสตางค์มีความหมายและเป็นกำลังใจให้ผมอย่างยิ่งครับ! ✨</p>
        </div>
        <a href="#" id="btnBackHome" class="btn-primary" style="text-decoration: none; display: block; text-align: center;">กลับหน้าหลัก</a>
      </div>
    </div>
  </div>
  <script>
    async function loadThankYouSettings() {
      const params = new URLSearchParams(window.location.search);
      const username = params.get('username');
      if (!username) return;

      // Handle Back to Home redirect
      const btnBackHome = document.getElementById('btnBackHome');
      if (btnBackHome) {
        btnBackHome.href = `/${username}`;
      }

      try {
        const response = await fetch(`/api/page/${username}/settings`);
         if (response.ok) {
           const data = await response.json();
           
           const profileImg = document.getElementById('profileImage');
           if (profileImg && data.profileImage) {
             profileImg.src = data.profileImage;
             profileImg.style.display = 'block';
           }

           if (data.profileGlowColor) {
             document.documentElement.style.setProperty('--avatar-glow-color', data.profileGlowColor);
           }

           document.getElementById('thankYouHeader').textContent = data.thankYouHeader || 'ขอบคุณมากครับ!';
           document.getElementById('thankYouSubtitle').textContent = data.thankYouSubtitle || 'สำหรับการสนับสนุนของคุณ ทุกบาททุกสตางค์มีความหมายและเป็นกำลังใจให้ผมอย่างยิ่งครับ! ✨';

           if (data.pageBgUrl) {
             try {
               const u = new URL(data.pageBgUrl);
               if (u.protocol === 'https:' || u.protocol === 'http:') {
                 const safeUrl = data.pageBgUrl.replace(/"/g, '%22');
                 const isWebm = data.pageBgUrl.toLowerCase().endsWith('.webm');
                 if (isWebm) {
                   let bgVid = document.getElementById('page-bg-video');
                   if (!bgVid) {
                     bgVid = document.createElement('video');
                     bgVid.id = 'page-bg-video';
                     bgVid.autoplay = true; bgVid.loop = true; bgVid.muted = true; bgVid.playsInline = true;
                     Object.assign(bgVid.style, {
                       position: 'fixed', top: '0', left: '0', width: '100%', height: '100%',
                       zIndex: '-1', objectFit: 'cover', opacity: '0.1', pointerEvents: 'none'
                     });
                     document.body.insertBefore(bgVid, document.body.firstChild);
                   }
                   bgVid.src = data.pageBgUrl;
                 } else {
                   let bgDiv = document.getElementById('page-bg-layer');
                   if (!bgDiv) {
                     bgDiv = document.createElement('div');
                     bgDiv.id = 'page-bg-layer';
                     document.body.insertBefore(bgDiv, document.body.firstChild);
                   }
                   Object.assign(bgDiv.style, {
                     position: 'fixed', top: '0', left: '0', width: '100%', height: '100%',
                     zIndex: '-1', backgroundSize: 'cover',
                     backgroundPosition: 'center', backgroundRepeat: 'no-repeat', opacity: '0.1', pointerEvents: 'none'
                   });
                   const preload = new Image();
                   preload.src = safeUrl;
                   (preload.decode ? preload.decode() : Promise.resolve()).catch(() => {}).finally(() => {
                     bgDiv.style.backgroundImage = `url("${safeUrl}")`;
                   });
                 }
               }
             } catch(e) {}
           }
         }
      } catch (error) {
        console.error('Error loading thank you settings:', error);
      }
    }
    window.addEventListener('DOMContentLoaded', loadThankYouSettings);
  </script>
</body>
</html>
