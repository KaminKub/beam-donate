<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าบัญชี - TipKub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ปิด caret ทั้งโปรเจกต์ ยกเว้นกล่องพิมพ์ข้อความ */
    *, *::before, *::after {
      caret-color: transparent !important;
    }
    input, textarea, [contenteditable="true"] {
      caret-color: auto !important;
    }

    html {
      overflow-x: hidden;
    }
    * {
      box-sizing: border-box;
    }
    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --bg: #0f172a;
      --text: #ffffff;
      --glass: rgba(255, 255, 255, 0.1);
      --accent: #a5b4fc;
    }
    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .bg-orbs {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -1;
      filter: blur(80px);
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      opacity: 0.5;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -10%; left: -10%; }
    .orb-2 { width: 400px; height: 400px; background: var(--secondary); bottom: -10%; right: -10%; }
    .orb-3 { width: 300px; height: 300px; background: #3b82f6; top: 40%; left: 40%; }

    .setup-container {
      text-align: center;
      width: 90%;
      max-width: 500px;
      padding: 3rem 2rem;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 1;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .profile-section {
      margin-bottom: 2rem;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.2s;
      opacity: 0;
    }
    .profile-img {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid var(--primary);
      margin-bottom: 1.2rem;
      box-shadow: 0 0 28px rgba(102, 126, 234, 0.5);
      object-fit: cover;
    }
    h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .url-input-group {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 0.5rem 1rem;
      margin-bottom: 2rem;
      transition: all 0.3s ease;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.4s;
      opacity: 0;
    }
    .url-input-group:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
    }
    .url-prefix {
      color: #64748b;
      font-size: 1.1rem;
      white-space: nowrap;
      user-select: none;
    }
    .url-input {
      background: transparent;
      border: none;
      color: white;
      font-family: 'Kanit', sans-serif;
      font-size: 1.1rem;
      padding: 0.5rem;
      width: 100%;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.6s;
      opacity: 0;
    }
    .btn-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Success Popup */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 1rem;
    }
    .popup {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
      padding: 2.5rem 2rem;
      border-radius: 24px;
      text-align: center;
      border: 1px solid rgba(102, 126, 234, 0.3);
      box-shadow: 0 0 60px rgba(102, 126, 234, 0.2), 0 20px 40px rgba(0, 0, 0, 0.4);
      transform: scale(0.5);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 420px;
      width: 100%;
    }
    .popup.show {
      transform: scale(1);
      opacity: 1;
    }
    .popup-profile-img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px solid rgba(102, 126, 234, 0.6);
      box-shadow: 0 0 28px rgba(102, 126, 234, 0.5);
      margin-bottom: 1.2rem;
      object-fit: cover;
    }
    .popup h3 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      color: white;
      font-weight: 700;
    }
    .popup .popup-username {
      font-size: 1rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 0.25rem;
    }
    .popup .popup-url {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(102, 126, 234, 0.12);
      border: 1px solid rgba(102, 126, 234, 0.25);
      border-radius: 10px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-bottom: 1.5rem;
      font-family: 'Outfit', 'Noto Sans Thai', sans-serif;
      letter-spacing: 0.02em;
    }
    .popup .popup-url i {
      color: #60a5fa;
      cursor: pointer;
      font-size: 0.85rem;
      transition: color 0.2s;
    }
    .popup .popup-url i:hover {
      color: #93c5fd;
    }
    .popup .popup-url i.copied {
      color: #22c55e;
    }
    .popup p {
      color: #94a3b8;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .popup .btn-dashboard {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      width: auto;
      padding: 0.85rem 2rem;
      font-size: 1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
    }
    .popup .btn-dashboard:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(102, 126, 234, 0.45);
    }

    @media (max-width: 480px) {
      .popup {
        padding: 2rem 1.25rem;
        border-radius: 20px;
      }
      .popup-icon-wrap .fa-circle-check {
        font-size: 2.8rem;
      }
      .popup-profile-img {
        width: 120px;
        height: 120px;
      }
      .popup h3 {
        font-size: 1.3rem;
      }
      .popup .popup-url {
        font-size: 0.8rem;
        padding: 0.5rem 0.75rem;
      }
      .popup .btn-dashboard {
        width: 100%;
        justify-content: center;
      }
    }

    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .setup-container {
        padding: 2rem 1rem;
      }
      h2 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="setup-container">
    <div class="profile-section">
      <img src="/avatar.jpg" id="profile-img" class="profile-img" alt="Profile">
      <h2 id="twitch-name">ยินดีต้อนรับ!</h2>
      <p class="subtitle">กำหนดชื่อ URL หน้าโดเนทของคุณ</p>
    </div>

    <div class="url-input-group">
      <span class="url-prefix">tipkub.me/</span>
      <input type="text" id="username-input" class="url-input" placeholder="username" spellcheck="false">
    </div>

     <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;padding:0.75rem 1rem;background:rgba(0,0,0,0.2);border-radius:12px;border:1px solid rgba(255,255,255,0.08);animation:fadeInUp 0.8s cubic-bezier(0.16,1,0.3,1) forwards;animation-delay:0.55s;opacity:0;">
       <input type="checkbox" id="tos-checkbox" style="width:18px;height:18px;cursor:pointer;accent-color:#667eea;flex-shrink:0;">
       <label for="tos-checkbox" style="font-size:0.9rem;color:#cbd5e1;cursor:pointer;text-align:left;line-height:1.4;">
         ข้าพเจ้าอ่านและยอมรับ
         <a href="/terms-of-services" target="_blank" style="color:#a5b4fc;text-decoration:underline;text-underline-offset:3px;">ข้อกำหนดและเงื่อนไขการให้บริการ</a>
         ของ TipKub
       </label>
     </div>
     <button id="submit-btn" class="btn-submit" disabled>
       <span id="btn-text">สร้างหน้าโดเนทของฉัน</span>
       <div id="spinner" class="loading-spinner"></div>
     </button>
     <div id="status-msg" style="margin-top: 1rem; font-size: 0.9rem; color: #f87171; min-height: 1.2rem;"></div>
  </div>

  <div id="success-overlay" class="overlay">
    <div id="success-popup" class="popup">
      <img id="popup-profile-img" class="popup-profile-img" src="/avatar.jpg" alt="Profile">
      <h3 id="popup-title">อูวววห์!</h3>
      <p id="success-msg">คุณมีหน้าโดเนทใน TipKub แล้ว!</p>
      <div class="popup-url">
        <span id="popup-url-text">tipkub.me/username</span>
        <i class="fa-solid fa-copy" id="btn-copy-url" title="คัดลอกลิงก์"></i>
      </div>
      <a href="/dashboard" id="dashboard-link" class="btn-dashboard">
        <i class="fa-solid fa-gauge-high"></i> เข้าสู่ Dashboard
      </a>
    </div>
  </div>

  <script>
    const profileImg = document.getElementById('profile-img');
    const twitchName = document.getElementById('twitch-name');
    const usernameInput = document.getElementById('username-input');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const spinner = document.getElementById('spinner');
    const successOverlay = document.getElementById('success-overlay');
    const successPopup = document.getElementById('success-popup');
    const successMsg = document.getElementById('success-msg');
    const popupProfileImg = document.getElementById('popup-profile-img');
    const popupUrlText = document.getElementById('popup-url-text');
    const popupTitle = document.getElementById('popup-title');
    const btnCopyUrl = document.getElementById('btn-copy-url');
    const tosCheckbox = document.getElementById('tos-checkbox');

    tosCheckbox.addEventListener('change', () => {
      submitBtn.disabled = !tosCheckbox.checked;
    });

    let currentUsername = '';

    if (btnCopyUrl) {
      btnCopyUrl.addEventListener('click', (e) => {
        e.stopPropagation();
        const url = `https://tipkub.me/${currentUsername}`;
        navigator.clipboard.writeText(url).then(() => {
          btnCopyUrl.classList.add('copied');
          setTimeout(() => btnCopyUrl.classList.remove('copied'), 2000);
        }).catch(() => {});
      });
    }

    async function init() {
      try {
        const res = await fetch('/api/register/pending');
        if (!res.ok) window.location.href = '/login';
        
        const data = await res.json();
        profileImg.src = data.profileImage;
        const displayName = data.twitchName || data.streamlabsName || data.streamlabsUsername || 'Unknown';
        twitchName.textContent = displayName;
        const suggestedUser = (data.twitchName || data.streamlabsUsername || '').toLowerCase().replace(/\s+/g, '');
        usernameInput.value = suggestedUser;
      } catch (e) {
        window.location.href = '/login';
      }
    }

    submitBtn.onclick = async () => {
      const statusMsg = document.getElementById('status-msg');
      const username = usernameInput.value.trim().toLowerCase();
      
      if (!username) {
        statusMsg.innerHTML = '<i class="fa-solid fa-circle-xmark" style="color:#ef4444;"></i> กรุณากรอก Username';
        return;
      }

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      spinner.style.display = 'block';
      statusMsg.textContent = 'กำลังสร้างหน้าโดเนทของคุณ...';
      statusMsg.style.color = '#94a3b8';

      try {
        const res = await fetch('/api/register/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, tos_accepted: true })
        });
        
        if (!res.ok) {
          const errorData = await res.json().catch(() => ({ error: `Server Error (${res.status})` }));
          throw new Error(errorData.error || `Error ${res.status}`);
        }

        const data = await res.json();

        if (data.success) {
          currentUsername = data.username;
          successMsg.textContent = `คุณ ${data.username} มีหน้าโดเนทใน TipKub แล้ว!`;
          popupTitle.textContent = 'อูวววห์!';
          popupUrlText.textContent = `tipkub.me/${data.username}`;
          if (popupProfileImg) popupProfileImg.src = profileImg.src;
          successOverlay.style.display = 'flex';
          setTimeout(() => {
            successPopup.classList.add('show');
          }, 10);
          
          document.getElementById('dashboard-link').href = `/${data.username}/dashboard`;
        } else {
          throw new Error(data.error || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ');
        }
      } catch (e) {
        console.error('Registration Error:', e);
        statusMsg.innerHTML = `<i class="fa-solid fa-circle-xmark" style="color:#ef4444;"></i> ${e.message}`;
        statusMsg.style.color = '#f87171';
        submitBtn.disabled = !tosCheckbox.checked;
        btnText.style.display = 'block';
        spinner.style.display = 'none';
      }
    };

    init();
  </script>
</body>
</html>
