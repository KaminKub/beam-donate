<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation Alert Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Kanit:wght@400;600;700&family=Mitr:wght@400;600&family=Noto+Sans+Thai:wght@400;600;700;800&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/overlay/overlay.css?v=20260720_2">
</head>
<body>
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="outline-h-0" x="-15%" y="-15%" width="130%" height="130%">
        <feMerge><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="outline-h-1" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="outline-h-2" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="outline-h-3" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology operator="dilate" radius="3" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="outline-h-4" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology operator="dilate" radius="4" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="outline-h-5" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology operator="dilate" radius="5" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="outline-m-0" x="-15%" y="-15%" width="130%" height="130%">
        <feMerge><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="outline-m-1" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="outline-m-2" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="outline-m-3" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology operator="dilate" radius="3" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="outline-m-4" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology operator="dilate" radius="4" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="outline-m-5" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology operator="dilate" radius="5" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>
  <!-- Alert Container -->
  <div id="alertContainer"></div>

  <!-- Alert Template (ซ่อนไว้ ใช้ clone) -->
  <template id="alertTemplate">
    <div class="alert-box">
      <div class="alert-glow"></div>
      <div class="alert-content">
         <div class="alert-icon">
           <span class="icon-emoji"><i class="fa-solid fa-heart"></i></span>
           <div class="icon-ring"></div>
         </div>
        <div class="alert-info">
          <div class="alert-header">
            <span class="donor-name"></span>
          </div>
          <div class="alert-amount"></div>
          <div class="alert-message"></div>
        </div>
      </div>
      <div class="alert-progress">
        <div class="alert-progress-bar"></div>
      </div>
    </div>
  </template>

  <script src="/overlay/overlay.js?v=20260811_1"></script>
</body>
</html>
