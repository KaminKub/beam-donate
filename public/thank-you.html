<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขอบคุณที่เลี้ยงกาแฟ!</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Glowing Background Blur Orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="container">
    <div class="card glass-card thank-you">
      <div class="icon glowing-heart">💝</div>
      <h1 id="thankYouHeader">ขอบคุณมากครับ!</h1>
      <p id="thankYouSubtitle" class="subtitle">สำหรับการสนับสนุนของคุณ<br>ทุกบาททุกสตางค์มีความหมายและเป็นกำลังใจให้ผมอย่างยิ่งครับ! ✨</p>
      <a href="/" class="btn-primary" style="text-decoration: none; display: block; text-align: center;">กลับหน้าหลัก</a>
    </div>
  </div>
  <script>
    async function loadThankYouSettings() {
      const params = new URLSearchParams(window.location.search);
      const username = params.get('username');
      if (!username) return;

      try {
        const response = await fetch(`/api/page/${username}/settings`);
        if (response.ok) {
          const data = await response.json();
          document.getElementById('thankYouHeader').textContent = data.thankYouHeader || 'ขอบคุณมากครับ!';
          document.getElementById('thankYouSubtitle').textContent = data.thankYouSubtitle || 'สำหรับการสนับสนุนของคุณ ทุกบาททุกสตางค์มีความหมายและเป็นกำลังใจให้ผมอย่างยิ่งครับ! ✨';
        }
      } catch (error) {
        console.error('Error loading thank you settings:', error);
      }
    }
    window.addEventListener('DOMContentLoaded', loadThankYouSettings);
  </script>
</body>
</html>
