<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Dock | TipKub</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body.dock-body {
      font-family: 'Kanit', sans-serif;
      background: #0c0f1d;
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .dock {
      max-width: 420px;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .dock-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .dock-title {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
    }
    /* ponytail: .highlight-amount shine kept per TipKub logo standard — precedent dona-monitor.html ships same
       animation on an OBS-embedded persistent page; text span is tiny, negligible repaint cost.
       QA finding #3 exception (user-approved option ข): paused via prefers-reduced-motion AND while the
       Dock tab/window is hidden (body.dock-hidden, toggled on visibilitychange in JS below, not per-frame) */
    .highlight-amount {
      background: linear-gradient(90deg, #4ade80 0%, #ffffff 50%, #4ade80 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      display: inline-block;
      line-height: 1.3;
      animation: shineText 3s linear infinite;
    }
    @keyframes shineText { to { background-position: -200% center; } }
    @media (prefers-reduced-motion: reduce) {
      .highlight-amount { animation: none; }
    }
    body.dock-hidden .highlight-amount { animation-play-state: paused; }
    .dock-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
    }
    .dock-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      flex-shrink: 0;
    }
    .dock-badge-dot.online { background: #22c55e; box-shadow: 0 0 5px rgba(34, 197, 94, 0.5); }
    .dock-badge-dot.offline { background: #ef4444; box-shadow: 0 0 5px rgba(239, 68, 68, 0.5); }
    .dock-readout {
      text-align: center;
      padding: 12px 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    #dockTime {
      font-size: 40px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
      transition: color 0.15s ease;
    }
    #dockRunState {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .dock-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .dock-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.15s ease, background-image 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
    }
    .dock-btn:active { transform: translateY(0) scale(0.96); }
    .dock-btn.busy { opacity: 0.55; pointer-events: none; }
    .dock-btn-start {
      --dock-accent: 16, 185, 129;
      --dock-glow: rgba(var(--dock-accent), 0.40);
      --pulse-color: rgba(var(--dock-accent), 0.55);
      background: radial-gradient(circle at 100% 0%, rgba(var(--dock-accent), 0.16), transparent 38%),
                  linear-gradient(140deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
      border-color: rgba(var(--dock-accent), 0.22);
    }
    .dock-btn-start:hover, .dock-btn-start.confirm {
      background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.22), transparent 40%),
                  linear-gradient(140deg, rgba(var(--dock-accent), 1), rgba(var(--dock-accent), 0.82));
      border-color: rgba(var(--dock-accent), 0.85);
      color: #fff; transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--dock-glow), 0 0 14px var(--dock-glow);
    }
    .dock-btn-stop {
      --dock-accent: 245, 158, 11;
      --dock-glow: rgba(var(--dock-accent), 0.40);
      --pulse-color: rgba(var(--dock-accent), 0.55);
      background: radial-gradient(circle at 100% 0%, rgba(var(--dock-accent), 0.16), transparent 38%),
                  linear-gradient(140deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
      border-color: rgba(var(--dock-accent), 0.22);
    }
    .dock-btn-stop:hover {
      background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.22), transparent 40%),
                  linear-gradient(140deg, rgba(var(--dock-accent), 1), rgba(var(--dock-accent), 0.82));
      border-color: rgba(var(--dock-accent), 0.85);
      color: #fff; transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--dock-glow), 0 0 14px var(--dock-glow);
    }
    .dock-btn-reset {
      --dock-accent: 59, 130, 246;
      --dock-glow: rgba(var(--dock-accent), 0.40);
      --pulse-color: rgba(var(--dock-accent), 0.55);
      background: radial-gradient(circle at 100% 0%, rgba(var(--dock-accent), 0.16), transparent 38%),
                  linear-gradient(140deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
      border-color: rgba(var(--dock-accent), 0.22);
    }
    .dock-btn-reset:hover {
      background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.22), transparent 40%),
                  linear-gradient(140deg, rgba(var(--dock-accent), 1), rgba(var(--dock-accent), 0.82));
      border-color: rgba(var(--dock-accent), 0.85);
      color: #fff; transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--dock-glow), 0 0 14px var(--dock-glow);
    }
    .dock-btn-reset.confirm {
      --dock-accent: 239, 68, 68;
      --dock-glow: rgba(var(--dock-accent), 0.40);
      --pulse-color: rgba(var(--dock-accent), 0.55);
      background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.22), transparent 40%),
                  linear-gradient(140deg, rgba(var(--dock-accent), 1), rgba(var(--dock-accent), 0.82));
      border-color: rgba(var(--dock-accent), 0.85);
      color: #fff;
      box-shadow: 0 4px 12px var(--dock-glow), 0 0 14px var(--dock-glow);
    }
    .dock-btn:hover i { color: #fff; }
    .dock-btn-reset.confirm i { color: #fff; }
    .dock-btn-gear {
      --dock-accent: 129, 140, 248;
      --dock-glow: rgba(var(--dock-accent), 0.40);
      --pulse-color: rgba(var(--dock-accent), 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(var(--dock-accent), 0.22);
      background: radial-gradient(circle at 100% 0%, rgba(var(--dock-accent), 0.16), transparent 38%),
                  linear-gradient(140deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.15s ease, background-image 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
    }
    .dock-btn-gear:hover {
      background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.22), transparent 40%),
                  linear-gradient(140deg, rgba(var(--dock-accent), 1), rgba(var(--dock-accent), 0.82));
      border-color: rgba(var(--dock-accent), 0.85);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--dock-glow), 0 0 14px var(--dock-glow);
    }
    .dock-btn-gear:active { transform: translateY(0) scale(0.96); }
    .dock-btn-tiktok {
      --dock-accent: 105, 201, 208;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 8px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(var(--dock-accent), 0.25);
      background: radial-gradient(circle at 100% 0%, rgba(var(--dock-accent), 0.18), transparent 38%),
                  linear-gradient(140deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
      color: #69c9d0;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background-image 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .dock-btn-tiktok:hover {
      background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.14), transparent 40%),
                  linear-gradient(140deg, rgba(var(--dock-accent), 0.32), rgba(var(--dock-accent), 0.20));
      border-color: #69c9d0;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(var(--dock-accent), 0.3);
    }
    .dock-btn-tiktok:active { transform: translateY(0) scale(0.96); }
    .dock-delta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .dock-delta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
      cursor: pointer;
      transition: transform 0.15s ease, background-image 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
    }
    .dock-delta-btn:active { transform: translateY(0) scale(0.96); }
    .dock-delta-btn.busy { opacity: 0.55; pointer-events: none; }
    #dockBtnSub { --dock-accent: 239, 68, 68; --dock-glow: rgba(var(--dock-accent), 0.40); --pulse-color: rgba(var(--dock-accent), 0.55); }
    #dockBtnAdd { --dock-accent: 16, 185, 129; --dock-glow: rgba(var(--dock-accent), 0.40); --pulse-color: rgba(var(--dock-accent), 0.55); }
    #dockBtnSub:hover, #dockBtnAdd:hover {
      background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.22), transparent 40%),
                  linear-gradient(140deg, rgba(var(--dock-accent), 1), rgba(var(--dock-accent), 0.82));
      border-color: rgba(var(--dock-accent), 0.85);
      color: #fff; transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--dock-glow), 0 0 14px var(--dock-glow);
    }
    #dockDelta {
      width: 64px;
      text-align: center;
      padding: 8px 4px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    #dockDelta:focus { border-color: #818cf8; }
    .dock-delta-unit {
      font-size: 11px;
      color: #94a3b8;
      min-width: 32px;
    }
    .dock-hint {
      font-size: 11px;
      color: #94a3b8;
      opacity: 0.8;
      text-align: center;
    }
    .dock-toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    }
    .dock-toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .dock-toast.success { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
    .dock-toast.error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    /* ── Cap readout (ใน .dock-readout) ── */
    /* Show/Hide transition บังคับ — ห้าม display:none ↔ block ดิบ */
    .dock-cap { max-height: 0; opacity: 0; overflow: hidden; padding: 0 12px;
      transition: max-height .28s ease, opacity .2s ease, margin-top .28s ease; }
    .dock-cap.open { max-height: 40px; opacity: 1; margin-top: 8px; }
    .dock-cap-bar { height: 3px; border-radius: 2px; background: rgba(148,163,184,0.18); overflow: hidden; }
    .dock-cap-fill { height: 100%; width: 0%; border-radius: 2px; background: #10b981;
                     transition: width 0.4s ease, background-color 0.4s ease; }
    .dock-cap-text { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    .dock-cap-text b { color: #fbbf24; font-weight: 700; }
    .dock-cap-text.full b { color: #f59e0b; }

    /* ── แถวสวิตช์ ── */
    .dock-switches { display: flex; gap: 8px; flex-wrap: wrap; }
    .dock-pill { display: flex; align-items: center; justify-content: center; gap: 6px;
      --dock-accent: 96, 165, 250; --pulse-color: rgba(var(--dock-accent), 0.55);
      flex: 1 1 auto; min-width: 0; min-height: 36px; padding: 8px 10px; border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
      color: #94a3b8; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      transition: transform .15s ease, background-image .15s ease, background-color .15s ease, border-color .15s ease,
                  box-shadow .15s ease, color .15s ease; }
    .dock-pill:active { transform: scale(0.96); }
    .dock-pill.busy, .dock-chip.busy { opacity: .55; pointer-events: none; }
    .dock-pill.on {
      --dock-accent: 96, 165, 250; --pulse-color: rgba(var(--dock-accent), 0.55);
      color: #e2e8f0; border-color: rgba(var(--dock-accent), 0.5);
      background: radial-gradient(circle at 100% 0%, rgba(var(--dock-accent), 0.22), transparent 40%),
                  linear-gradient(140deg, rgba(var(--dock-accent), 0.20), rgba(var(--dock-accent), 0.10));
    }
    .dock-pill.on i { color: #60a5fa; }
    .dock-pill-power {
      --dock-accent: 16, 185, 129; --pulse-color: rgba(var(--dock-accent), 0.55);
    }
    .dock-pill-power.on {
      border-color: rgba(var(--dock-accent), 0.5);
      background: radial-gradient(circle at 100% 0%, rgba(var(--dock-accent), 0.22), transparent 40%),
                  linear-gradient(140deg, rgba(var(--dock-accent), 0.20), rgba(var(--dock-accent), 0.10));
    }
    .dock-pill-power.on i { color: #10b981; }
    .dock-pill-power.confirm {
      --dock-accent: 245, 158, 11; --pulse-color: rgba(var(--dock-accent), 0.55);
      border-color: rgba(var(--dock-accent), 0.85);
      background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.22), transparent 40%),
                  linear-gradient(140deg, rgba(var(--dock-accent), 1), rgba(var(--dock-accent), 0.82));
      color: #fff;
    }
    .dock-pill-power.confirm i { color: #fff; }

    /* ── Section พับได้ ── */
    .dock-section { border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; }
    .dock-section-head {
      --dock-accent: 148, 163, 184; --pulse-color: rgba(var(--dock-accent), 0.45);
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      padding: 10px 12px; border: 0; color: #e2e8f0;
      background: radial-gradient(circle at 100% 0%, rgba(var(--dock-accent), 0.10), transparent 38%),
                  linear-gradient(140deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background-image .15s ease; }
    .dock-section-head:hover {
      background: radial-gradient(circle at 100% 0%, rgba(var(--dock-accent), 0.18), transparent 40%),
                  linear-gradient(140deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
    }
    .dock-chevron { color: #94a3b8; font-size: 11px; transition: transform .25s ease; }
    .dock-section-head[aria-expanded="true"] .dock-chevron { transform: rotate(180deg); }
    /* Show/Hide transition บังคับ — ห้าม display:none ↔ block ดิบ */
    .dock-section-body { max-height: 0; opacity: 0; overflow: hidden;
      transition: max-height .28s ease, opacity .2s ease, padding .28s ease; padding: 0 12px; }
    .dock-section-body.open { max-height: 260px; opacity: 1; padding: 12px; }

    .dock-chips { display: flex; gap: 6px; }
    .dock-chip {
      --dock-accent: 245, 158, 11; --pulse-color: rgba(var(--dock-accent), 0.55);
      flex: 1 1 0; min-width: 0; padding: 8px 6px; border-radius: 8px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
      color: #94a3b8; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      transition: transform .15s ease, background-image .15s ease, background-color .15s ease, border-color .15s ease, color .15s ease; }
    .dock-chip:active { transform: scale(0.96); }
    .dock-chip.on {
      background: radial-gradient(circle at 100% 0%, rgba(var(--dock-accent), 0.24), transparent 40%),
                  linear-gradient(140deg, rgba(var(--dock-accent), 0.20), rgba(var(--dock-accent), 0.10));
      border-color: rgba(var(--dock-accent), 0.5); color: #fbbf24;
    }

    /* Show/Hide transition บังคับ — ห้าม display:none ↔ block ดิบ */
    .dock-cap-value { display: flex; align-items: center; gap: 8px; max-height: 0; opacity: 0; overflow: hidden;
      transition: max-height .28s ease, opacity .2s ease, margin-top .28s ease; }
    .dock-cap-value.open { max-height: 60px; opacity: 1; margin-top: 10px; }
    .dock-cap-value input { flex: 1 1 auto; min-width: 0; padding: 8px 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
      color: #e2e8f0; font-family: inherit; font-size: 13px; outline: none; }
    .dock-cap-value input:focus { border-color: #818cf8; }
    .dock-cap-unit { font-size: 11px; color: #94a3b8; min-width: 40px; }
    .dock-btn-resetcap { width: 100%; margin-top: 10px; }
    .dock-btn-resetcap { --dock-accent: 245, 158, 11; --dock-glow: rgba(var(--dock-accent), 0.40); --pulse-color: rgba(var(--dock-accent), 0.55); }
    .dock-btn-resetcap:hover {
      background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.22), transparent 40%),
                  linear-gradient(140deg, rgba(var(--dock-accent), 1), rgba(var(--dock-accent), 0.82));
      border-color: rgba(var(--dock-accent), 0.85); color: #fff;
      transform: translateY(-2px); box-shadow: 0 4px 12px var(--dock-glow), 0 0 14px var(--dock-glow);
    }
    .dock-btn-resetcap.confirm {
      --dock-accent: 239, 68, 68;
      background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.22), transparent 40%),
                  linear-gradient(140deg, rgba(var(--dock-accent), 1), rgba(var(--dock-accent), 0.82));
      border-color: rgba(var(--dock-accent), 0.85); color: #fff;
      box-shadow: 0 4px 12px rgba(var(--dock-accent), 0.40), 0 0 14px rgba(var(--dock-accent), 0.40);
    }
    .dock-btn-resetcap.confirm i { color: #fff; }

    @media (max-width: 400px) {
      .dock-pill { flex: 1 1 100%; }     /* ปุ่มเรียงเป็นแถวเดียวต่อบรรทัด */
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 4px; }
    @media (max-width: 400px) {
      .dock-controls { grid-template-columns: 1fr 1fr; }
      .dock-controls .dock-btn-reset { grid-column: 1 / -1; }
      #dockTime { font-size: 32px; }
    }

    /* ── Post-click pulse ring (ref: assets/style.css .tk-btn-pulse ~505) ── */
    @keyframes tkBtnPulse {
      0%   { box-shadow: 0 0 0 0 var(--pulse-color, rgba(148,163,184,.5)); }
      100% { box-shadow: 0 0 0 14px rgba(0,0,0,0); }
    }
    .tk-btn-pulse { animation: tkBtnPulse .45s ease-out; }
    @media (prefers-reduced-motion: reduce) {
      .tk-btn-pulse { animation: none; }
    }
  </style>
</head>
<body class="dock-body">
  <div class="dock">
    <div class="dock-head">
      <span class="dock-title"><span class="highlight-amount">TipKub</span> Timer Dock</span>
      <button type="button" class="dock-btn-gear" id="dockBtnGear" title="ตั้งค่า Timer"><i class="fa-solid fa-gear"></i></button>
      <span class="dock-badge" id="dockConnBadge">
        <span class="dock-badge-dot" id="dockBadgeDot"></span>
        <span id="dockBadgeText">กำลังเชื่อมต่อ...</span>
      </span>
    </div>

    <div class="dock-readout">
      <div id="dockTime">--:--</div>
      <div id="dockRunState">-</div>
      <div class="dock-cap" id="dockCapRow"
           title="โควตานี้นับเฉพาะเวลาที่มาจากโดเนท/Gift — สตรีมเมอร์กด +/- เองไม่กินโควตา">
        <div class="dock-cap-bar"><div class="dock-cap-fill" id="dockCapFill"></div></div>
        <div class="dock-cap-text" id="dockCapText"></div>
      </div>
    </div>

    <div class="dock-controls">
      <button type="button" class="dock-btn dock-btn-start" id="dockBtnStart" title="เริ่มนับเวลา"><i class="fa-solid fa-play"></i> เริ่ม</button>
      <button type="button" class="dock-btn dock-btn-stop" id="dockBtnStop" title="หยุดนับเวลาชั่วคราว"><i class="fa-solid fa-pause"></i> หยุด</button>
      <button type="button" class="dock-btn dock-btn-reset" id="dockBtnReset" title="รีเซทเวลากลับค่าเริ่มต้น"><i class="fa-solid fa-rotate-left"></i> รีเซท</button>
    </div>

    <div class="dock-delta">
      <button type="button" class="dock-delta-btn" id="dockBtnSub" title="ลดเวลา"><i class="fa-solid fa-minus"></i></button>
      <input type="number" id="dockDelta" value="30" min="1" step="1">
      <span class="dock-delta-unit" id="dockDeltaUnit">วินาที</span>
      <button type="button" class="dock-delta-btn" id="dockBtnAdd" title="เพิ่มเวลา"><i class="fa-solid fa-plus"></i></button>
    </div>

    <div class="dock-switches">
      <button type="button" class="dock-pill dock-pill-power" id="dockBtnEnabled" aria-pressed="false" title="เปิด/ปิด Timer (ต้องกดยืนยัน 2 ครั้ง)">
        <i class="fa-solid fa-power-off"></i> <span id="dockBtnEnabledLabel">Timer: ปิด</span>
      </button>
      <button type="button" class="dock-pill" id="dockTglRules" aria-pressed="false" title="แสดงกฏใน Widget">
        <i class="fa-solid fa-list-check"></i> กฏ
      </button>
      <button type="button" class="dock-pill" id="dockTglCap" aria-pressed="false" title="แสดงข้อจำกัดใน Widget">
        <i class="fa-solid fa-gauge-high"></i> ข้อจำกัด
      </button>
    </div>

    <div class="dock-section">
      <button type="button" class="dock-section-head" id="dockCapHead" aria-expanded="false" aria-controls="dockCapPanel">
        <span><i class="fa-solid fa-gauge-high" style="color:#f59e0b"></i> ข้อจำกัด (Cap)</span>
        <i class="fa-solid fa-chevron-down dock-chevron"></i>
      </button>
      <div class="dock-section-body" id="dockCapPanel">
        <div class="dock-chips" role="group" aria-label="รูปแบบข้อจำกัด">
          <button type="button" class="dock-chip" data-cap="">ไม่จำกัด</button>
          <button type="button" class="dock-chip" data-cap="money">ยอดเงิน</button>
          <button type="button" class="dock-chip" data-cap="time">เวลา</button>
        </div>
        <div class="dock-cap-value" id="dockCapValueRow">
          <input type="number" id="dockCapValue" min="1" max="1000000" step="1" inputmode="numeric">
          <span class="dock-cap-unit" id="dockCapUnit">บาท</span>
        </div>
        <button type="button" class="dock-btn dock-btn-resetcap" id="dockBtnResetCap" title="ล้างยอดสะสมของข้อจำกัด (ต้องกดยืนยัน 2 ครั้ง)">
          <i class="fa-solid fa-rotate-left"></i> รีเซทข้อจำกัด
        </button>
      </div>
    </div>

    <button type="button" class="dock-btn-tiktok" id="dockBtnTiktok" title="เปิด TikTok Bridge"><i class="fa-brands fa-tiktok"></i> เชื่อม TikTok Live</button>

    <div class="dock-hint">Dock นี้ควบคุมจริงเสมอ (Live) — ไม่มีโหมดทดสอบ</div>
  </div>

  <div class="dock-toast" id="dockToast"></div>

  <script>
    (function () {
      var DEMO = !!window.DEMO_MODE;
      var _csrfToken = null;
      var remaining = 600;
      var syncTime = Date.now(); // wall-clock anchor for remaining — recompute drift-free instead of -1/tick
      var running = false;
      var timeUnit = 'seconds';
      var tickInterval = null;
      var toastTimer = null;
      var timerCfg = null;      // object จาก JSON.parse(timer_settings) ครั้งล่าสุด
      var capCurrent = 0;
      var amountSuffix = 'บาท';

      async function ensureCsrfToken() {
        if (_csrfToken) return _csrfToken;
        try {
          var res = await fetch('/api/csrf-token');
          if (res.ok) { var data = await res.json(); _csrfToken = data.csrfToken; }
        } catch (e) {}
        return _csrfToken;
      }

      async function fetchWithCsrf(url, options) {
        options = options || {};
        var method = (options.method || 'GET').toUpperCase();
        if (DEMO && method !== 'GET' && !url.startsWith('/api/demo/')) {
          toast('Demo Mode — ไม่สามารถดำเนินการนี้ได้', 'error');
          return { ok: false, status: 403, _demoBlocked: true, json: async function () { return {}; } };
        }
        var token = await ensureCsrfToken();
        var headers = Object.assign({}, options.headers || {});
        if (token) headers['X-CSRF-Token'] = token;
        var res = await fetch(url, Object.assign({}, options, { headers: headers }));
        if (res.status === 403) {
          var body;
          try { body = await res.json(); } catch (e) { body = null; }
          if (body && body.code === 'CSRF_INVALID') {
            _csrfToken = null;
            token = await ensureCsrfToken();
            headers['X-CSRF-Token'] = token;
            return fetch(url, Object.assign({}, options, { headers: headers }));
          }
        }
        return res;
      }

      function toast(message, type) {
        var el = document.getElementById('dockToast');
        if (!el) return;
        el.textContent = message;
        el.className = 'dock-toast show ' + (type || 'success');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          el.className = 'dock-toast ' + (type || 'success');
        }, 2000);
      }

      function setBadge(state) {
        var dot = document.getElementById('dockBadgeDot');
        var text = document.getElementById('dockBadgeText');
        if (!dot || !text) return;
        dot.className = 'dock-badge-dot' + (state === 'online' ? ' online' : state === 'offline' ? ' offline' : '');
        text.textContent = state === 'online' ? 'เชื่อมต่อแล้ว'
          : state === 'offline' ? 'การเชื่อมต่อหลุด — กำลังลองใหม่'
          : 'กำลังเชื่อมต่อ...';
      }

      function formatTime(sec) {
        sec = Math.max(0, Math.round(sec));
        var h = Math.floor(sec / 3600);
        var m = Math.floor((sec % 3600) / 60);
        var s = sec % 60;
        var mm = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
        return h > 0 ? h + ':' + mm : mm;
      }
      // ponytail: self-check for the branch above — fails loud in devtools console if the hour logic regresses
      console.assert(formatTime(59) === '00:59', 'formatTime(59) expected 00:59');
      console.assert(formatTime(3600) === '1:00:00', 'formatTime(3600) expected 1:00:00');
      console.assert(formatTime(0) === '00:00', 'formatTime(0) expected 00:00');

      function liveRemaining() {
        if (!running) return remaining;
        return Math.max(0, remaining - (Date.now() - syncTime) / 1000);
      }

      function render() {
        var r = liveRemaining();
        var timeEl = document.getElementById('dockTime');
        var stateEl = document.getElementById('dockRunState');
        if (timeEl) {
          timeEl.textContent = formatTime(r);
          timeEl.style.color = r < 60 ? '#ef4444' : '#f8fafc';
        }
        if (stateEl) stateEl.textContent = running ? 'กำลังนับ' : 'หยุดชั่วคราว';
      }

      function stopTick() {
        if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
      }

      function startTick() {
        stopTick();
        tickInterval = setInterval(function () {
          if (!running) { stopTick(); return; }
          render();
          if (liveRemaining() <= 0) stopTick();
        }, 1000);
      }

      function applyState(data) {
        var rem = data.timer_remaining_seconds !== undefined ? data.timer_remaining_seconds : data.remaining;
        var run = data.timer_running !== undefined ? data.timer_running : data.running;
        if (rem !== undefined && rem !== null) remaining = Math.round(Number(rem));
        if (run !== undefined && run !== null) running = !!run;
        syncTime = Date.now();
        if (data.capCurrent !== undefined)        capCurrent = Number(data.capCurrent) || 0;
        if (data.timer_cap_current !== undefined) capCurrent = Number(data.timer_cap_current) || 0;
        if (data.capType !== undefined && timerCfg) {          // SSE ส่ง config มาด้วย — sync ให้ตรง
          timerCfg.cap_type = data.capType || null;
          timerCfg.cap_value = Number(data.capValue) || 0;
          syncSwitches();
        }
        renderCap();
        render();
        if (running) startTick(); else stopTick();
      }

      function syncSwitches() {
        if (!timerCfg) return;
        var btnEnabled = document.getElementById('dockBtnEnabled');
        var lblEnabled = document.getElementById('dockBtnEnabledLabel');
        var tglRules = document.getElementById('dockTglRules');
        var tglCap = document.getElementById('dockTglCap');
        var capValueRow = document.getElementById('dockCapValueRow');
        var capUnitEl = document.getElementById('dockCapUnit');
        var capValueEl = document.getElementById('dockCapValue');

        var isEnabled = timerCfg.enabled === 1 || timerCfg.enabled === true;
        if (btnEnabled) {
          btnEnabled.classList.toggle('on', isEnabled);
          btnEnabled.setAttribute('aria-pressed', String(isEnabled));
        }
        if (lblEnabled) lblEnabled.textContent = isEnabled ? 'Timer: เปิด' : 'Timer: ปิด';

        var showRules = timerCfg.show_rules !== 0 && timerCfg.show_rules !== false;
        if (tglRules) {
          tglRules.classList.toggle('on', showRules);
          tglRules.setAttribute('aria-pressed', String(showRules));
        }

        var showCap = timerCfg.show_cap === 1 || timerCfg.show_cap === true;
        if (tglCap) {
          tglCap.classList.toggle('on', showCap);
          tglCap.setAttribute('aria-pressed', String(showCap));
        }

        var capType = timerCfg.cap_type || '';
        document.querySelectorAll('.dock-chip').forEach(function (chip) {
          chip.classList.toggle('on', (chip.getAttribute('data-cap') || '') === capType);
        });

        if (capValueRow) capValueRow.classList.toggle('open', !!capType);
        if (capUnitEl) {
          capUnitEl.textContent = capType === 'money' ? amountSuffix
            : (timerCfg.time_unit === 'minutes' ? 'นาที' : 'วินาที');
        }
        if (capValueEl && document.activeElement !== capValueEl) {
          var capVal = Number(timerCfg.cap_value) || 0;
          if (capType === 'time' && timerCfg.time_unit === 'minutes') {
            capValueEl.value = Math.round(capVal / 60);
          } else {
            capValueEl.value = capVal || '';
          }
        }
      }

      // ลอกกติกาเดียวกับ timer.js formatTimeDelta()
      function formatCapTime(sec) {
        var s = Math.abs(Math.floor(sec));
        var h = Math.floor(s / 3600);
        var m = Math.floor((s % 3600) / 60);
        var rem = s % 60;
        if (h > 0 && m > 0) return h + ' ชม. ' + m + ' นาที';
        if (h > 0) return h + ' ชม.';
        if (m > 0 && rem > 0) return m + ' นาที ' + rem + ' วินาที';
        if (m > 0) return m + ' นาที';
        return rem + ' วินาที';
      }

      // R3-F5: เพดานค่าที่ผู้ใช้พิมพ์ได้ (หน่วยตามที่กรอก) — กัน 1e309/ค่าเวอร์เกินจริง
      var CAP_INPUT_MAX = 1000000;

      // ต้องตรงกับ dashboard.js:7376 เป๊ะ — จุดพลาดอันดับ 1 ของงานนี้
      function toSeconds(v) {
        v = Math.max(1, Number(v) || 0);
        var capType = timerCfg ? (timerCfg.cap_type || '') : '';
        var unit = timerCfg ? timerCfg.time_unit : 'seconds';
        return (capType === 'time' && unit === 'minutes') ? v * 60 : v;
      }

      // R3-F5: `1e309` → Infinity → JSON.stringify กลายเป็น {"cap_value":null} → server เก็บ config เสีย
      // ตรวจ finite/range ทั้งก่อน (ค่าที่พิมพ์) และหลังแปลงนาที→วินาที · คืน null = ห้าม POST
      function capValueToSave(input) {
        var raw = Number(input);
        var sec = Math.round(toSeconds(raw));
        if (!Number.isFinite(raw) || raw < 1 || raw > CAP_INPUT_MAX) return null;
        if (!Number.isFinite(sec) || sec < 1) return null;
        return sec;
      }

      function renderCap() {
        var row = document.getElementById('dockCapRow');
        var fill = document.getElementById('dockCapFill');
        var text = document.getElementById('dockCapText');
        if (!row || !timerCfg) return;
        var capType = timerCfg.cap_type || '';
        var capValue = Number(timerCfg.cap_value) || 0;
        if (!capType || capValue <= 0) { row.classList.remove('open'); return; }
        row.classList.add('open');

        var pct = Math.min(100, Math.round((capCurrent / capValue) * 100));
        if (fill) {
          fill.style.width = pct + '%';
          fill.style.backgroundColor = pct >= 100 ? '#ef4444' : pct >= 70 ? '#f59e0b' : '#10b981';
        }
        if (!text) return;
        text.classList.remove('full');
        if (capCurrent >= capValue) {
          text.classList.add('full');
          var b = document.createElement('b');
          b.textContent = 'ครบข้อจำกัดแล้ว — ปิดปรับเวลาอัตโนมัติ';
          text.replaceChildren(b);
          return;
        }
        var room = Math.max(0, capValue - capCurrent);
        var prefix, valueText;
        if (capType === 'money') {
          prefix = 'โดเนทปรับเวลาได้อีก ';
          valueText = Number(room).toLocaleString('th-TH') + ' ' + amountSuffix;
        } else {
          prefix = 'ปรับเวลาได้อีก ';
          valueText = formatCapTime(room);
        }
        var b2 = document.createElement('b');
        b2.textContent = valueText;
        text.replaceChildren(document.createTextNode(prefix), b2);
      }

      async function loadState() {
        try {
          var url = DEMO ? '/api/demo/overlay/settings' : '/api/overlay/settings';
          var res = await fetch(url);
          if (res.status === 401) {
            setBadge('offline');
            toast('เซสชันหมดอายุ — กำลังพาไปหน้าล็อกอิน', 'error');
            setTimeout(function () { location.reload(); }, 1500);
            return;
          }
          if (!res.ok) return;
          var s = await res.json();
          var t = {};
          try { t = JSON.parse(s.timer_settings || '{}'); } catch (e) {}
          timeUnit = t.time_unit === 'minutes' ? 'minutes' : 'seconds';
          var unitEl = document.getElementById('dockDeltaUnit');
          if (unitEl) unitEl.textContent = timeUnit === 'minutes' ? 'นาที' : 'วินาที';

          timerCfg = t;
          amountSuffix = s.amountSuffix || 'บาท';
          capCurrent = Number(s.timer_cap_current) || 0;
          syncSwitches();
          renderCap();

          var rem = Number(s.timer_remaining_seconds !== undefined && s.timer_remaining_seconds !== null ? s.timer_remaining_seconds : (t.initial_seconds || 600));
          if (s.timer_last_update && Number(s.timer_running)) {
            rem = Math.max(0, rem - (Date.now() - new Date(s.timer_last_update).getTime()) / 1000);
          }
          remaining = Math.round(rem);
          running = !!s.timer_running;
          syncTime = Date.now();
          render();
          if (running) startTick(); else stopTick();
        } catch (e) {}
      }

      async function ctl(action, delta) {
        var res;
        try {
          res = await fetchWithCsrf('/api/timer/control', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(delta ? { action: action, delta: delta } : { action: action })
          });
        } catch (e) {
          toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจอินเทอร์เน็ตแล้วลองใหม่', 'error');
          return false;
        }
        if (res._demoBlocked) return false; // toast already shown by fetchWithCsrf — don't stack a second one
        if (res.status === 401) {
          toast('เซสชันหมดอายุ — กำลังพาไปหน้าล็อกอิน', 'error');
          setTimeout(function () { location.reload(); }, 1500);
          return false;
        }
        var data = await res.json().catch(function () { return {}; });
        if (data.success) { applyState(data); return data; }
        toast(data.error || 'ทำรายการไม่สำเร็จ กรุณาลองใหม่', 'error');
        return false;
      }

      // timer_settings ถูกเขียนทับทั้งก้อนฝั่ง server (ไม่มี merge) ⇒ ต้อง GET สดก่อนทุกครั้ง
      // แล้วแก้เฉพาะ key ที่เปลี่ยน กันกฏ/สี/เสียงของ Timer หายทั้งชุด
      async function saveTimerPatch(patch, btn) {
        if (btn) btn.classList.add('busy');
        try {
          var url = DEMO ? '/api/demo/overlay/settings' : '/api/overlay/settings';
          var res;
          try {
            res = await fetch(url);
          } catch (e) {
            toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจอินเทอร์เน็ตแล้วลองใหม่', 'error');
            syncSwitches();
            return false;
          }
          if (res.status === 401) {
            toast('เซสชันหมดอายุ — กำลังพาไปหน้าล็อกอิน', 'error');
            setTimeout(function () { location.reload(); }, 1500);
            return false;
          }
          if (!res.ok) {
            toast('อ่านการตั้งค่าเดิมไม่ได้ ยังไม่บันทึก — ลองใหม่อีกครั้ง', 'error');
            syncSwitches();
            return false;
          }
          var s = await res.json();
          var fresh;
          try {
            fresh = JSON.parse(s.timer_settings || '{}');
          } catch (e) {
            fresh = null;
          }
          if (!fresh || typeof fresh !== 'object' || Array.isArray(fresh)) {
            toast('อ่านการตั้งค่าเดิมไม่ได้ ยังไม่บันทึก — ลองใหม่อีกครั้ง', 'error');
            syncSwitches();
            return false;
          }
          var merged = Object.assign({}, fresh, patch);
          var saveRes = await fetchWithCsrf('/api/overlay/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ timer_settings: JSON.stringify(merged) })
          });
          if (saveRes._demoBlocked) { syncSwitches(); return false; }
          if (saveRes.status === 401) {
            toast('เซสชันหมดอายุ — กำลังพาไปหน้าล็อกอิน', 'error');
            setTimeout(function () { location.reload(); }, 1500);
            return false;
          }
          var data = await saveRes.json().catch(function () { return {}; });
          if (data.success) {
            timerCfg = merged;
            await loadState();
            return true;
          }
          toast(data.error || 'บันทึกไม่สำเร็จ กรุณาลองใหม่', 'error');
          syncSwitches();
          return false;
        } catch (e) {
          // R3-F4: res.json() / fetchWithCsrf / response parse โยนได้ทุกจุด — caller ใช้ .then()
          // ไม่มี .catch() ⇒ ถ้าไม่รับตรงนี้จะได้ unhandled rejection + UI ค้างค่าที่ยังไม่ถูกบันทึก
          toast('บันทึกไม่สำเร็จ กรุณาลองใหม่', 'error');
          await loadState();   // ดึงค่า authoritative กลับมา — ห้ามปล่อย UI ค้างค่าที่ผู้ใช้เพิ่งกด
          return false;
        } finally {
          if (btn) btn.classList.remove('busy');
        }
      }

      async function withBusy(btn, fn) {
        if (!btn) return fn();
        btn.classList.add('busy');
        try { return await fn(); }
        finally { btn.classList.remove('busy'); }
      }

      function deltaSeconds() {
        var v = parseInt(document.getElementById('dockDelta').value, 10) || 0;
        v = Math.max(1, v);
        return timeUnit === 'minutes' ? v * 60 : v;
      }

      function deltaLabel() {
        var v = Math.max(1, parseInt(document.getElementById('dockDelta').value, 10) || 0);
        return v + (timeUnit === 'minutes' ? ' นาที' : ' วินาที');
      }

      // toast the delta the server actually applied (data.applied_delta), not the delta requested —
      // server clamps at 0/cap so a -300 request at 30s left only ever applies -30
      function reportDelta(sign, requestedSec, reqLabel, data, zeroMsg) {
        var applied = Math.round(Number(data.applied_delta));
        if (applied === 0) { toast(zeroMsg, 'success'); return; }
        var shown = Math.abs(applied) === requestedSec ? reqLabel : Math.abs(applied) + ' วินาที';
        toast(sign + shown, 'success');
      }

      // กดครั้งแรก = arm (เปลี่ยนหน้าปุ่ม + auto-disarm ใน 3 วิ) · กดครั้งที่สอง = คืน true
      // ห้ามใช้ window.confirm() — dialog ใน OBS CEF ไม่การันตีว่าจะเด้ง (กติกาเดิมของ Dock)
      var _armed = new Map();   // btn -> { timer, idleHTML }
      function armOrConfirm(btn, armedHTML) {
        if (_armed.has(btn)) { disarm(btn); return true; }
        var idleHTML = btn.innerHTML;
        btn.innerHTML = armedHTML;
        btn.classList.add('confirm');
        var timer = setTimeout(function () { disarm(btn); }, 3000);
        _armed.set(btn, { timer: timer, idleHTML: idleHTML });
        return false;
      }

      function disarm(btn) {
        var st = _armed.get(btn);
        if (!st) return;
        clearTimeout(st.timer);
        btn.innerHTML = st.idleHTML;
        btn.classList.remove('confirm');
        _armed.delete(btn);
      }

      document.addEventListener('DOMContentLoaded', function () {
        // finding #3: pause .highlight-amount shine while Dock is hidden/minimized — event-driven, not per-frame
        document.body.classList.toggle('dock-hidden', document.hidden);
        document.addEventListener('visibilitychange', function () {
          document.body.classList.toggle('dock-hidden', document.hidden);
        });

        var btnStart = document.getElementById('dockBtnStart');
        var btnStop = document.getElementById('dockBtnStop');
        var btnReset = document.getElementById('dockBtnReset');
        var btnAdd = document.getElementById('dockBtnAdd');
        var btnSub = document.getElementById('dockBtnSub');

        btnStart.addEventListener('click', function () {
          withBusy(btnStart, async function () {
            if (await ctl('start')) toast('เริ่มนับแล้ว', 'success');
          });
        });
        btnStop.addEventListener('click', function () {
          withBusy(btnStop, async function () {
            if (await ctl('stop')) toast('หยุดแล้ว', 'success');
          });
        });
        btnReset.addEventListener('click', function () {
          if (!armOrConfirm(btnReset, '<i class="fa-solid fa-triangle-exclamation"></i> กดอีกครั้งเพื่อยืนยัน')) return;
          withBusy(btnReset, async function () {
            if (await ctl('reset')) toast('รีเซทเวลาแล้ว', 'success');
          });
        });
        btnAdd.addEventListener('click', function () {
          var reqSec = deltaSeconds(), reqLabel = deltaLabel();
          withBusy(btnAdd, async function () {
            var data = await ctl('add', reqSec);
            if (data) reportDelta('+', reqSec, reqLabel, data, 'ถึงเวลาสูงสุดแล้ว เพิ่มต่อไม่ได้');
          });
        });
        btnSub.addEventListener('click', function () {
          var reqSec = deltaSeconds(), reqLabel = deltaLabel();
          withBusy(btnSub, async function () {
            var data = await ctl('sub', reqSec);
            if (data) reportDelta('-', reqSec, reqLabel, data, 'เวลาเหลือ 0 แล้ว ลดต่อไม่ได้');
          });
        });

        var btnEnabled = document.getElementById('dockBtnEnabled');
        if (btnEnabled) btnEnabled.addEventListener('click', function () {
          var next = !(timerCfg && (timerCfg.enabled === 1 || timerCfg.enabled === true));
          if (!armOrConfirm(btnEnabled, '<i class="fa-solid fa-triangle-exclamation"></i> กดอีกครั้งเพื่อยืนยัน')) return;
          saveTimerPatch({ enabled: next ? 1 : 0 }, btnEnabled).then(function (ok) {
            if (ok) toast(next ? 'เปิด Timer แล้ว' : 'ปิด Timer แล้ว', 'success');
          });
        });

        var tglRules = document.getElementById('dockTglRules');
        if (tglRules) tglRules.addEventListener('click', function () {
          var next = !(timerCfg && timerCfg.show_rules !== 0 && timerCfg.show_rules !== false);
          saveTimerPatch({ show_rules: next ? 1 : 0 }, tglRules).then(function (ok) {
            if (ok) toast(next ? 'แสดงกฏใน Widget แล้ว' : 'ซ่อนกฏใน Widget แล้ว', 'success');
          });
        });

        var tglCap = document.getElementById('dockTglCap');
        if (tglCap) tglCap.addEventListener('click', function () {
          var next = !(timerCfg && (timerCfg.show_cap === 1 || timerCfg.show_cap === true));
          saveTimerPatch({ show_cap: next ? 1 : 0 }, tglCap).then(function (ok) {
            if (ok) toast(next ? 'แสดงข้อจำกัดใน Widget แล้ว' : 'ซ่อนข้อจำกัดใน Widget แล้ว', 'success');
          });
        });

        document.querySelectorAll('.dock-chip').forEach(function (chip) {
          chip.addEventListener('click', function () {
            var v = chip.getAttribute('data-cap') || '';
            saveTimerPatch({ cap_type: v || null }, chip).then(function (ok) {
              if (ok) toast('เปลี่ยนรูปแบบข้อจำกัดแล้ว (ยอดสะสมถูกรีเซท)', 'success');
            });
          });
        });

        var capValueEl = document.getElementById('dockCapValue');
        if (capValueEl) capValueEl.addEventListener('change', function () {
          var sec = capValueToSave(capValueEl.value);
          if (sec === null) {
            toast('ค่าลิมิตต้องเป็นตัวเลข 1–' + CAP_INPUT_MAX.toLocaleString('th-TH'), 'error');
            capValueEl.blur();     // syncSwitches() ข้าม input ที่ยัง focus อยู่
            syncSwitches();
            return;
          }
          saveTimerPatch({ cap_value: sec }).then(function (ok) {
            if (ok) toast('บันทึกค่าลิมิตแล้ว', 'success');
          });
        });

        var btnResetCap = document.getElementById('dockBtnResetCap');
        if (btnResetCap) btnResetCap.addEventListener('click', function () {
          if (!armOrConfirm(btnResetCap, '<i class="fa-solid fa-triangle-exclamation"></i> กดอีกครั้งเพื่อยืนยัน')) return;
          withBusy(btnResetCap, async function () {
            if (await ctl('reset-cap')) toast('รีเซทข้อจำกัดแล้ว', 'success');
          });
        });

        var capHead = document.getElementById('dockCapHead');
        var capPanel = document.getElementById('dockCapPanel');
        if (capHead && capPanel) capHead.addEventListener('click', function () {
          var open = !capPanel.classList.contains('open');
          capPanel.classList.toggle('open', open);
          capHead.setAttribute('aria-expanded', String(open));
        });

        var btnGear = document.getElementById('dockBtnGear');
        if (btnGear) btnGear.addEventListener('click', function () {
          window.open('/dashboard/?tab=overlay-config&subtab=timer', '_blank');
        });

        var btnTiktok = document.getElementById('dockBtnTiktok');
        if (btnTiktok) btnTiktok.addEventListener('click', function () {
          window.open('/tiktok-bridge/', '_blank');
        });

        loadState();

        var sseUrl = DEMO ? '/api/demo/alerts/stream?source=demo-timer' : '/api/alerts/stream?source=timer-dock';
        var es = new EventSource(sseUrl);
        es.onmessage = function (e) {
          var data;
          try { data = JSON.parse(e.data); } catch (err) { return; }
          if (data.type === 'connected') {
            setBadge('online');
            loadState();
          } else if (data.type === 'timer_update') {
            applyState(data);
          } else if (data.type === 'settings_update') {
            loadState();   // สตรีมเมอร์แก้ค่าในแดชบอร์ด → Dock ต้องตามทัน ไม่ให้ RMW ทับของใหม่
          }
        };
        es.onerror = function () { setBadge('offline'); };
      });

      // Click pulse — delegated (dock-chip สร้างด้วย JS) · dock-btn-tiktok เปิดแท็บใหม่ ⇒ ห้ามใส่
      document.addEventListener('click', function (e) {
        var btn = e.target.closest('.dock-btn-start, .dock-btn-stop, .dock-btn-reset, .dock-btn-gear, .dock-btn-resetcap, #dockBtnSub, #dockBtnAdd, .dock-pill, .dock-chip, .dock-section-head');
        if (!btn) return;
        btn.classList.remove('tk-btn-pulse');
        void btn.offsetWidth;
        btn.classList.add('tk-btn-pulse');
      });
    })();
  </script>
</body>
</html>
