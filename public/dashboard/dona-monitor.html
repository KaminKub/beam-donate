<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dona-Monitor | TipKub</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Kanit:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/dashboard/admin.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans Thai', 'Outfit', 'Chakra Petch', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .popup-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0;
    }
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(99, 102, 241, 0.2);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .popup-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .popup-header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
    }
    .popup-header h1 .highlight {
      color: #818cf8;
    }
    .popup-header-right {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-alert {
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-alert:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .btn-alert-fire {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #1a1a2e;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.35);
      font-weight: 700;
    }
    .btn-alert-close {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .popup-status-mini {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 16px;
      background: rgba(15, 23, 42, 0.7);
      font-size: 10px;
      color: #64748b;
      border-bottom: 1px solid rgba(99, 102, 241, 0.06);
    }
    .status-mini-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4b5563;
      flex-shrink: 0;
    }
    .status-mini-dot.online {
      background: #22c55e;
      box-shadow: 0 0 5px rgba(34, 197, 94, 0.5);
    }
    .auto-refresh-indicator {
      font-size: 10px;
      color: #64748b;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(100, 116, 139, 0.15);
      white-space: nowrap;
    }
    .popup-filter-bar {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(5px);
      border-bottom: 1px solid rgba(99, 102, 241, 0.1);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .popup-search {
      flex: 1;
      min-width: 150px;
      padding: 6px 10px 6px 32px;
      border-radius: 8px;
      border: 1px solid rgba(99, 102, 241, 0.25);
      background: rgba(30, 41, 59, 0.8);
      color: #e2e8f0;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .popup-search:focus { border-color: #818cf8; }
    .popup-search-wrapper {
      position: relative;
      flex: 1;
      min-width: 150px;
    }
    .popup-search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: #64748b;
      pointer-events: none;
    }
    .popup-filter-select {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(99, 102, 241, 0.25);
      background: rgba(30, 41, 59, 0.8);
      color: #e2e8f0;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }
    .popup-filter-select:focus { border-color: #818cf8; }
    .popup-table-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px;
    }
    .popup-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .popup-table thead {
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .popup-table th {
      padding: 8px 10px;
      text-align: left;
      font-weight: 600;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 2px solid rgba(99, 102, 241, 0.2);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .popup-table td {
      padding: 7px 10px;
      border-bottom: 1px solid rgba(99, 102, 241, 0.08);
      vertical-align: middle;
    }
    .popup-table tbody tr {
      transition: background 0.15s;
    }
    .popup-table tbody tr:hover {
      background: rgba(99, 102, 241, 0.06);
    }
    .popup-table .col-status { width: 10%; min-width: 65px; white-space: nowrap; }
    .popup-table .col-actions { width: 20%; min-width: 70px; white-space: nowrap; }
    .popup-table .col-donor { width: 16%; font-weight: 500; }
    .popup-table .col-amount { width: 12%; font-weight: 600; color: #818cf8; white-space: nowrap; }
    .popup-table .col-message { width: 18%; color: #94a3b8; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .popup-table .col-date { width: 14%; white-space: nowrap; }
    .popup-table .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
      font-size: 13px;
    }
    .popup-action-btns {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .popup-btn-sm {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: all 0.12s;
      font-family: inherit;
      white-space: nowrap;
    }
    .popup-btn-sm:hover { filter: brightness(1.2); transform: translateY(-1px); }
    .popup-btn-inspect {
      background: rgba(100, 116, 139, 0.2);
      color: #94a3b8;
    }
    .popup-btn-refire {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
    }
    .popup-btn-force {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
    }
    /* ========== Dona-Monitor Icon Colors ========== */
    .popup-header .fa-bolt { color: #1a1a2e; }
    .auto-refresh-indicator .fa-clock { color: #818cf8; }
    .popup-search-icon .fa-magnifying-glass { color: #64748b; }
    .popup-btn-refire .fa-bell { color: #fbbf24; }
    .popup-btn-force .fa-check { color: #22c55e; }
    .confirm-modal-icon .fa-sack-dollar { color: #f59e0b; }
    .confirm-modal-title .fa-circle-check { color: #22c55e; }
    .empty-state .fa-triangle-exclamation { color: #f59e0b; margin-right: 4px; }
    /* ========================================== */
    .popup-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid rgba(99, 102, 241, 0.15);
      font-size: 11px;
      color: #64748b;
      flex-shrink: 0;
    }
    .popup-footer .count {
      color: #818cf8;
      font-weight: 500;
    }

    /* SlipOK Quota Monitor (minimal footer badge) */
    .quota-monitor-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(99, 102, 241, 0.08);
      font-size: 10px;
      font-weight: 500;
      color: #94a3b8;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .quota-monitor-badge:hover {
      background: rgba(99, 102, 241, 0.18);
    }
    .quota-monitor-badge .fa-receipt {
      font-size: 9px;
      color: #818cf8;
    }
    .quota-monitor-text {
      font-variant-numeric: tabular-nums;
    }
    .quota-monitor-bar-bg {
      display: inline-block;
      width: 28px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
      vertical-align: middle;
    }
    .quota-monitor-bar {
      display: block;
      height: 100%;
      border-radius: 2px;
      background: #22c55e;
      transition: width 0.5s ease;
      width: 0%;
    }
    .quota-monitor-bar.warn { background: #eab308; }
    .quota-monitor-bar.danger { background: #ef4444; }
    .quota-monitor-refresh-icon {
      font-size: 8px;
      color: #64748b;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .quota-monitor-badge:hover .quota-monitor-refresh-icon {
      opacity: 1;
      color: #818cf8;
    }
    .quota-monitor-refresh-icon.spinning {
      animation: reloadSpin 1s linear infinite;
    }
    @keyframes reloadSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .popup-notification {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      z-index: 999;
      pointer-events: none;
      animation: popupNotifIn 0.25s ease, popupNotifOut 0.25s ease 2.5s forwards;
    }
    @keyframes popupNotifIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes popupNotifOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-50%) translateY(-10px); } }
    .popup-notification.success { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
    .popup-notification.error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-success { background: rgba(34, 197, 94, 0.15); color: #22c55e; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 500; }
    .badge-pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 500; }
    .badge-failed { background: rgba(239, 68, 68, 0.15); color: #f87171; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 500; }
    .badge-expired { background: rgba(100, 116, 139, 0.15); color: #94a3b8; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 500; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.5); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    .modal.active {
      display: flex;
      animation: modalFade 0.25s ease forwards;
    }
    .modal-content {
      background: #0b0e17;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }
    .confirm-modal-body {
      text-align: center;
      padding: 2rem;
    }
    .confirm-modal-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .confirm-modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #e2e8f0;
    }
    .confirm-modal-text {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 1.5rem;
      white-space: pre-line;
    }
    .confirm-modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn-cancel {
      padding: 8px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-cancel:hover { background: rgba(255, 255, 255, 0.15); }
    .btn-confirm {
      padding: 8px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-confirm:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3); }
    @keyframes modalFade {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes modalFadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.95); }
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="popup-header-left">
        <h1><span class="highlight">TipKub</span> Dona-Monitor</h1>
        <span class="auto-refresh-indicator" id="refreshIndicator"><i class="fa-solid fa-clock"></i> Auto 10s</span>
      </div>
      <div class="popup-header-right">
        <button class="btn-alert btn-alert-fire" id="btnQuickAlert"><i class="fa-solid fa-bolt"></i> Quick Alert</button>
        <button class="btn btn-icon-round refresh-hover" id="btnRefresh" title="รีเฟรช"><i class="fa-solid fa-arrow-rotate-right"></i></button>
        <button class="btn-alert btn-alert-close" id="btnCloseWindow" title="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <div class="popup-status-mini" id="overlayStatusBar">
      <span class="status-mini-dot" id="overlayStatusDot"></span>
      <span id="overlayStatusText">ตรวจสอบสถานะ...</span>
    </div>

    <div class="popup-filter-bar">
      <div class="popup-search-wrapper">
        <span class="popup-search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" class="popup-search" id="inputSearch" placeholder="ค้นหาผู้บริจาค / Ref ID...">
      </div>
      <select class="popup-filter-select" id="selectStatus">
        <option value="all">ทั้งหมด</option>
        <option value="successful">สำเร็จ</option>
        <option value="pending">รอชำระ</option>
        <option value="failed">ล้มเหลว</option>
        <option value="expired">หมดอายุ</option>
      </select>
    </div>

    <div class="popup-table-wrap">
      <table class="popup-table" id="transactionsTable">
        <thead>
          <tr>
            <th class="col-status">สถานะ</th>
            <th class="col-actions">จัดการ</th>
            <th class="col-donor">ผู้บริจาค</th>
            <th class="col-amount">ยอดเงิน</th>
            <th class="col-message">ข้อความ</th>
            <th class="col-date">วัน-เวลา</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="6" class="empty-state">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="popup-footer">
      <span>รายการ: <span class="count" id="rowCount">0</span></span>
      <span class="quota-monitor-badge" id="quotaMonitorBadge" title="เครดิต SlipOK คงเหลือ — คลิกเพื่อรีเฟรช">
        <i class="fa-solid fa-receipt"></i>
        <span class="quota-monitor-text" id="quotaMonitorText">—/—</span>
        <span class="quota-monitor-bar-bg">
          <span class="quota-monitor-bar" id="quotaMonitorBar"></span>
        </span>
        <i class="fa-solid fa-rotate quota-monitor-refresh-icon" id="quotaMonitorRefreshIcon"></i>
      </span>
      <span>TipKub Dona-Monitor v1.0</span>
    </div>
  </div>

  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <div class="confirm-modal-body">
        <div class="confirm-modal-icon" id="confirmModalIcon"><i class="fa-solid fa-sack-dollar"></i></div>
        <div class="confirm-modal-title" id="confirmModalTitle">ยืนยันการดำเนินการ</div>
        <div class="confirm-modal-text" id="confirmModalText">คุณแน่ใจหรือไม่?</div>
        <div class="confirm-modal-actions">
          <button class="btn-cancel" id="btnConfirmCancel">ยกเลิก</button>
          <button class="btn-confirm" id="btnConfirmOk">ยืนยัน</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allTransactions = [];
    let refreshInterval = null;
    const REFRESH_SECONDS = 10;
    let countdown = REFRESH_SECONDS;
    let _csrfToken = null;

    async function ensureCsrfToken() {
      if (_csrfToken) return _csrfToken;
      try {
        var res = await fetch('/api/csrf-token');
        if (res.ok) {
          var data = await res.json();
          _csrfToken = data.csrfToken;
        }
      } catch (e) {}
      return _csrfToken;
    }

    async function fetchWithCsrf(url, options) {
      options = options || {};
      var token = await ensureCsrfToken();
      var headers = Object.assign({}, options.headers || {});
      if (token) headers['X-CSRF-Token'] = token;
      var res = await fetch(url, Object.assign({}, options, { headers: headers }));
      if (res.status === 403) {
        var body;
        try { body = await res.json(); } catch (e) { body = null; }
        if (body && body.code === 'CSRF_INVALID') {
          _csrfToken = null;
          token = await ensureCsrfToken();
          headers['X-CSRF-Token'] = token;
          return fetch(url, Object.assign({}, options, { headers: headers }));
        }
      }
      return res;
    }

    function getUsername() {
      var parts = window.location.pathname.split('/');
      return parts[1];
    }

    function escapeHtml(text) {
      if (!text) return '';
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getStatusBadgeClass(status) {
      switch (status) {
        case 'successful': return 'badge-success';
        case 'pending': return 'badge-pending';
        case 'failed': return 'badge-failed';
        case 'expired': return 'badge-expired';
        default: return 'badge-pending';
      }
    }

    function getStatusLabel(status) {
      var labels = { successful: 'สำเร็จ', pending: 'รอชำระ', failed: 'ล้มเหลว', expired: 'หมดอายุ' };
      return labels[status] || status;
    }

    function showNotification(message, type) {
      var el = document.createElement('div');
      el.className = 'popup-notification ' + (type || 'success');
      el.textContent = message;
      document.body.appendChild(el);
      setTimeout(function() { el.remove(); }, 3000);
    }

    async function fetchTransactions() {
      var username = getUsername();
      try {
        var res = await fetch('/api/transactions/' + username);
        if (res.ok) {
          allTransactions = await res.json();
          allTransactions.sort(function(a, b) {
            return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
          });
          render();
        } else if (res.status === 401 || res.status === 403) {
          document.querySelector('#transactionsTable tbody').innerHTML =
            '<tr><td colspan="6" class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i> กรุณาเปิดหน้านี้จาก Dashboard / หมดเวลาเซสชัน</td></tr>';
        }
      } catch (err) {
        console.error('Fetch error:', err);
      }
      checkOverlayStatus();
    }

    function render() {
      var searchQuery = (document.getElementById('inputSearch').value || '').toLowerCase().trim();
      var filterStatus = document.getElementById('selectStatus').value;
      var tbody = document.querySelector('#transactionsTable tbody');

      var filtered = allTransactions.filter(function(t) {
        var nameMatch = (t.donor || '').toLowerCase().indexOf(searchQuery) !== -1 ||
                        (t.id || '').toLowerCase().indexOf(searchQuery) !== -1;
        var statusMatch = filterStatus === 'all' || t.status === filterStatus;
        return nameMatch && statusMatch;
      });

      document.getElementById('rowCount').textContent = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">ไม่พบข้อมูล</td></tr>';
        return;
      }

      var html = '';
      for (var i = 0; i < filtered.length; i++) {
        var t = filtered[i];
        var date = t.createdAt ? new Date(t.createdAt).toLocaleString('th-TH') : '-';
        var badgeClass = getStatusBadgeClass(t.status);
        var statusLabel = getStatusLabel(t.status);
        var escapedId = escapeHtml(t.id);
        var escapedDonor = escapeHtml(t.donor || 'Anonymous');
        var escapedMessage = escapeHtml(t.message || '-');
        var amount = (Number(t.amount) || 0).toLocaleString();

        html += '<tr>';
        html += '<td class="col-status"><span class="' + badgeClass + '">' + statusLabel + '</span></td>';
        html += '<td class="col-actions"><div class="popup-action-btns">';
        html += '<button class="popup-btn-sm popup-btn-refire" onclick="reAlert(\'' + escapedId + '\')" title="ยิง Alert ซ้ำ"><i class="fa-solid fa-bell"></i></button>';
        if (t.status === 'pending') {
          html += '<button class="popup-btn-sm popup-btn-force" onclick="forceSuccess(\'' + escapedId + '\')" title="ยืนยันการชำระเงิน"><i class="fa-solid fa-check"></i></button>';
        }
        html += '</div></td>';
        html += '<td class="col-donor">' + escapedDonor + '</td>';
        html += '<td class="col-amount">฿' + amount + '</td>';
        html += '<td class="col-message" title="' + escapedMessage + '">' + escapedMessage + '</td>';
        html += '<td class="col-date">' + date + '</td>';
        html += '</tr>';
      }
      tbody.innerHTML = html;
    }

    async function reAlert(id) {
      var tx = allTransactions.find(function(t) { return t.id === id; });
      if (!tx) return;
      try {
        var res = await fetchWithCsrf('/api/alerts/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ donor: tx.donor, amount: tx.amount, message: tx.message })
        });
        if (res.ok) showNotification('ส่ง Alert ซ้ำแล้ว!', 'success');
        else showNotification('ส่ง Alert ไม่สำเร็จ', 'error');
      } catch (e) {
        showNotification('เกิดข้อผิดพลาด', 'error');
      }
    }

    function showConfirmModal(title, text, icon, onConfirm) {
      var modal = document.getElementById('confirmModal');
      document.getElementById('confirmModalIcon').innerHTML = icon || '<i class="fa-solid fa-sack-dollar"></i>';
      document.getElementById('confirmModalTitle').innerHTML = title;
      document.getElementById('confirmModalText').textContent = text;

      modal.classList.add('active');

      var okBtn = document.getElementById('btnConfirmOk');
      var cancelBtn = document.getElementById('btnConfirmCancel');

      okBtn.onclick = function() {
        hideConfirmModal();
        onConfirm();
      };
      cancelBtn.onclick = hideConfirmModal;

      modal.onclick = function(e) {
        if (e.target === modal) hideConfirmModal();
      };
    }

    function hideConfirmModal() {
      var modal = document.getElementById('confirmModal');
      modal.style.animation = 'modalFadeOut 0.2s ease forwards';
      modal.addEventListener('animationend', function handler() {
        modal.classList.remove('active');
        modal.style.animation = '';
        modal.removeEventListener('animationend', handler);
      });
    }

    async function forceSuccess(id) {
      var tx = allTransactions.find(function(t) { return t.id === id; });
      if (!tx) return;
      var donorName = tx.donor || 'Anonymous';
      var amount = '฿' + (Number(tx.amount) || 0).toLocaleString();
      showConfirmModal(
        '<i class="fa-solid fa-circle-check"></i> ยืนยันการชำระเงินด้วยตนเอง',
        'ระบบจะเปลี่ยนสถานะเป็นชำระสำเร็จ\n\nผู้โดเนท: ' + donorName + '\nจำนวน: ' + amount,
        '<i class="fa-solid fa-sack-dollar"></i>',
        async function() {
          try {
            var res = await fetchWithCsrf('/api/transactions/' + id + '/status', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: 'successful' })
            });
            if (res.ok) { fetchTransactions(); showNotification('ยืนยันการชำระเงินสำเร็จ', 'success'); }
            else showNotification('ยืนยันการชำระเงินไม่สำเร็จ', 'error');
          } catch (e) {
            showNotification('เกิดข้อผิดพลาด', 'error');
          }
        }
      );
    }

    async function quickAlert() {
      var names = ['สมศักดิ์ รักเรียน', 'แม่ค้าออนไลน์สายลุย', 'น้องเป็ดก้าบๆ 🐤', 'สุดหล่อคีย์บอร์ดเรืองแสง', 'SuraGaming 🎮', 'นินจานักพัฒนา', 'ผู้สนับสนุนลึกลับ'];
      var messages = ['สู้ๆ นะครับพี่! 💪', 'ขอเพลงสากลชิลๆ เพลงนึงค่าา 🎵', 'ระบบใหม่เฟี้ยวมากครับ! ✨', 'บริจาคค่าน้ำเก๊กฮวย 🍺', 'ชอบเว็บนี้มาก 🚀', '', 'สุดจัดปลัดบอก!'];
      var amounts = [50, 100, 250, 500, 1000, 2500, 5000];
      var donor = names[Math.floor(Math.random() * names.length)];
      var message = messages[Math.floor(Math.random() * messages.length)];
      var amount = amounts[Math.floor(Math.random() * amounts.length)];
      try {
        var res = await fetchWithCsrf('/api/alerts/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ donor: donor, amount: amount, message: message })
        });
        if (res.ok) showNotification('ยิง Quick Alert แล้ว! (' + donor + ' ฿' + amount + ')', 'success');
        else showNotification('ยิง Alert ไม่สำเร็จ', 'error');
      } catch (e) {
        showNotification('เกิดข้อผิดพลาด', 'error');
      }
    }

    function updateCountdown() {
      countdown--;
      if (countdown <= 0) {
        countdown = REFRESH_SECONDS;
        fetchTransactions();
      }
      document.getElementById('refreshIndicator').innerHTML = '<i class="fa-solid fa-clock"></i> ' + countdown + 's';
    }

    function closeWindow() {
      if (window.opener) {
        window.close();
      } else {
        window.location.href = '/';
      }
    }

    async function checkOverlayStatus() {
      var dot = document.getElementById('overlayStatusDot');
      var text = document.getElementById('overlayStatusText');
      if (!dot || !text) return;
      try {
        var res = await fetch('/api/overlay/status/' + getUsername());
        if (res.ok) {
          var data = await res.json();
          if (data.active) {
            dot.classList.add('online');
            text.textContent = 'โดขึ้นจอ · เปิดอยู่';
            text.style.color = '#4ade80';
            return;
          }
        }
      } catch (e) {}
      dot.classList.remove('online');
      text.textContent = 'โดขึ้นจอ · ปิดอยู่';
      text.style.color = '#64748b';
    }

    async function fetchMonitorQuota() {
      var textEl = document.getElementById('quotaMonitorText');
      var barEl = document.getElementById('quotaMonitorBar');
      var badge = document.getElementById('quotaMonitorBadge');
      var refreshIcon = document.getElementById('quotaMonitorRefreshIcon');
      if (!textEl || !barEl) return;
      if (refreshIcon) refreshIcon.classList.add('spinning');

      try {
        var res = await fetch('/api/payment/slipok-quota?method=promptpay');
        if (res.status === 429) {
          if (badge) badge.title = 'ตรวจสอบบ่อยเกินไป กรุณารอสักครู่';
          return;
        }
        if (!res.ok) {
          res = await fetch('/api/payment/slipok-quota?method=truemoney');
          if (res.status === 429) {
            if (badge) badge.title = 'ตรวจสอบบ่อยเกินไป กรุณารอสักครู่';
            return;
          }
          if (!res.ok) { textEl.textContent = '—/—'; return; }
        }
        var result = await res.json();
        if (!result.success) { textEl.textContent = '—/—'; return; }

        var q = result.data;
        var snapshot = result.data.snapshotTotal;
        var remaining = q.quota || 0;
        var specialQuota = q.specialQuota || 0;
        var overQuota = q.overQuota || 0;

        var totalPool, used;
        if (snapshot && snapshot > 0) {
          totalPool = Math.max(snapshot, remaining) + specialQuota;
          used = Math.max(0, totalPool - remaining);
        } else {
          totalPool = remaining + specialQuota;
          used = overQuota;
        }
        var ratio = totalPool > 0 ? used / totalPool : 0;

        textEl.textContent = used + '/' + totalPool;
        barEl.style.width = (ratio * 100) + '%';
        barEl.className = ratio < 0.5 ? 'quota-monitor-bar'
                        : ratio < 0.8 ? 'quota-monitor-bar warn'
                        : 'quota-monitor-bar danger';

        if (badge) badge.title = 'ใช้ไป ' + used + ' จาก ' + totalPool + ' ครั้ง — คลิกเพื่อรีเฟรช';
      } catch (e) {
        textEl.textContent = '—/—';
      } finally {
        setTimeout(function() {
          if (refreshIcon) refreshIcon.classList.remove('spinning');
        }, 1200);
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      if (window.opener) {
        document.getElementById('btnCloseWindow').style.display = 'inline-block';
      }

      var btnRefresh = document.getElementById('btnRefresh');
      btnRefresh.addEventListener('click', async function() {
        btnRefresh.classList.add('spinning');
        countdown = REFRESH_SECONDS;
      document.getElementById('refreshIndicator').innerHTML = '<i class="fa-solid fa-clock"></i> ' + countdown + 's';
        await fetchTransactions();
        btnRefresh.classList.remove('spinning');
        showNotification('รีเฟรชแล้ว', 'success');
      });

      document.getElementById('btnQuickAlert').addEventListener('click', quickAlert);
      document.getElementById('btnCloseWindow').addEventListener('click', closeWindow);
      document.getElementById('inputSearch').addEventListener('input', render);
      document.getElementById('selectStatus').addEventListener('change', render);

      fetchTransactions();
      checkOverlayStatus();
      fetchMonitorQuota();
      refreshInterval = setInterval(updateCountdown, 1000);

      document.getElementById('quotaMonitorBadge')?.addEventListener('click', fetchMonitorQuota);
    });
  </script>
