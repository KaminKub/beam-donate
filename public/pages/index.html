  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ปิด caret ทั้งโปรเจกต์ ยกเว้นกล่องพิมพ์ข้อความ */
    *, *::before, *::after {
      caret-color: transparent !important;
    }
    input, textarea, [contenteditable="true"] {
      caret-color: auto !important;
    }

    html {
      overflow-x: hidden;
    }
    * {
      box-sizing: border-box;
    }
    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --bg: #0f172a;
      --text: #ffffff;
      --glass: rgba(255, 255, 255, 0.1);
    }
    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .bg-orbs {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -1;
      filter: blur(80px);
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      opacity: 0.5;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -10%; left: -10%; }
    .orb-2 { width: 400px; height: 400px; background: var(--secondary); bottom: -10%; right: -10%; }
    .orb-3 { width: 300px; height: 300px; background: #3b82f6; top: 40%; left: 40%; }

    .landing-container {
      text-align: center;
      width: 90%;
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem;
      z-index: 1;
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    h1 {
      font-size: 4rem;
      margin-bottom: 1rem;
      background: linear-gradient(to right, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.2s;
      opacity: 0;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    p {
      font-size: 1.2rem;
      color: #94a3b8;
      margin-bottom: 3rem;
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.4s;
      opacity: 0;
    }
    .cta-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.6s;
      opacity: 0;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .btn {
      padding: 1rem 2rem;
      font-size: 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary {
      background: var(--glass);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }
    .btn-secondary:hover {
       background: rgba(255, 255, 255, 0.2);
       transform: translateY(-3px);
     }
     .btn-small {
       padding: 0.5rem 1rem;
       font-size: 0.9rem;
       opacity: 0.7;
     }
     .btn-small:hover {
       opacity: 1;
     }
     .demo-btn-container {
       margin-top: 2rem;
       display: flex;
       flex-direction: column;
       align-items: center;
       gap: 0.6rem;
       animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
       animation-delay: 0.8s;
       opacity: 0;
     }
     .btn-demo-dashboard {
       padding: 0.35rem 0.85rem;
       font-size: 0.78rem;
       opacity: 0.55;
       background: rgba(102, 126, 234, 0.15);
       border: 1px solid rgba(165, 180, 252, 0.3);
       color: white;
       border-radius: 8px;
       text-decoration: none;
       backdrop-filter: blur(10px);
       transition: opacity 0.2s, transform 0.2s, background 0.2s;
       display: inline-block;
     }
     .btn-demo-dashboard:hover {
       opacity: 0.85;
       background: rgba(102, 126, 234, 0.28);
       transform: translateY(-2px);
     }
       .highlight-amount {
        background: linear-gradient(90deg, #4ade80 0%, #ffffff 50%, #4ade80 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
        display: inline-block;
        position: relative;
        width: fit-content;
        animation: shineText 3s linear infinite;
        line-height: 1.3;
      }
      .highlight-free {
        background: linear-gradient(90deg, #facc15 0%, #ffffff 50%, #facc15 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
        font-size: 1.3em;
        display: inline;
        animation: shineText 3s linear infinite;
      }
    @keyframes shineText {
      0% { background-position: 200% center; }
      100% { background-position: 0% center; }
    }

    @media (max-width: 480px) {
      p {
        font-size: 1rem;
      }
      .landing-container {
        width: 95%;
        padding: 1rem;
      }
    }
   </style>
