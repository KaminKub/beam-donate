<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer | TipKub</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/timer/timer.css">
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="timer-outline" x="-20%" y="-20%" width="140%" height="140%">
        <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="0.85" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge>
          <feMergeNode in="outline"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="timer-delta-outline" x="-25%" y="-25%" width="150%" height="150%">
        <feMorphology operator="dilate" radius="3" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="0.9" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge>
          <feMergeNode in="outline"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
  </svg>
</head>
<body>
  <div id="timerWrapper" style="display:none">
    <div id="timerDisplay">
      <span id="timerDigits">00:10:00</span>
    </div>
    <div id="timerRules"></div>
  </div>
  <div id="timerDeltaEl" style="display:none;"></div>
  <canvas id="timerEffectCanvas" style="position:fixed;top:0;left:0;pointer-events:none;display:none;z-index:9999;"></canvas>
  <script src="/timer/timer.js"></script>
</body>
</html>
