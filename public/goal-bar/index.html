<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Bar | TipKub</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Kanit:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/goal-bar/goal-bar.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
          integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
          crossorigin="anonymous"></script>
</head>
<body>
  <div id="goalBarWrapper" style="display:none;">
    <div id="goalLabel"></div>
    <div id="goalBarOuter">
      <div id="goalTrack">
        <div id="goalFill"></div>
      </div>
      <span id="goalBarText"></span>
    </div>
    <div id="goalFooter">
      <span id="goalSub1"></span>
      <span id="goalSub2"></span>
    </div>
  </div>
  <canvas id="goalParticleCanvas"></canvas>

  <div id="animStage">
    <div class="flip-card" id="flipCard">
      <div class="flip-front">
        <span class="tipkub-logo-text">TipKub</span>
      </div>
      <div class="flip-back">
        <span id="flipAmountText"></span>
      </div>
    </div>
  </div>

  <script src="/goal-bar/goal-bar.js"></script>
  <script src="/goal-bar/goal-bar-animation.js"></script>
</body>
</html>
