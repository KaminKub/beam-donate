<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Bar | TipKub</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Kanit:wght@400;500;600;700&family=Mitr:wght@400;600&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/goal-bar/goal-bar.css?v=20260718_29">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
          integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
          crossorigin="anonymous"></script>
</head>
<body>
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="outline-2" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology operator="dilate" radius="3" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="0.75" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge>
          <feMergeNode in="outline"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="outline-4" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#000000" flood-opacity="0.75" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge>
          <feMergeNode in="outline"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="goal-outline-label" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology id="goalOutlineDilateLabel" operator="dilate" radius="2" in="SourceAlpha" result="expanded"/>
        <feFlood id="goalOutlineFloodLabel" flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge>
          <feMergeNode in="outline"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="goal-outline-bar" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology id="goalOutlineDilateBar" operator="dilate" radius="2" in="SourceAlpha" result="expanded"/>
        <feFlood id="goalOutlineFloodBar" flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge>
          <feMergeNode in="outline"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="goal-outline-sub1" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology id="goalOutlineDilateSub1" operator="dilate" radius="2" in="SourceAlpha" result="expanded"/>
        <feFlood id="goalOutlineFloodSub1" flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge>
          <feMergeNode in="outline"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="goal-outline-sub2" x="-15%" y="-15%" width="130%" height="130%">
        <feMorphology id="goalOutlineDilateSub2" operator="dilate" radius="2" in="SourceAlpha" result="expanded"/>
        <feFlood id="goalOutlineFloodSub2" flood-color="#000000" flood-opacity="1" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge>
          <feMergeNode in="outline"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
  </svg>
  <div id="goalBarWrapper" style="display:none;">
    <div id="goalLabel"></div>
    <div id="goalBarOuter">
      <div id="goalTrack">
        <div id="goalFill"></div>
      </div>
      <span id="goalBarText"></span>
    </div>
    <div id="goalFooter">
      <span id="goalSub1"></span>
      <span id="goalSub2"></span>
    </div>
  </div>
  <canvas id="goalParticleCanvas"></canvas>

  <div id="animStage">
    <div class="flip-card" id="flipCard">
      <div class="flip-front">
        <span class="tipkub-logo-text">TipKub</span>
      </div>
      <div class="flip-back">
        <span id="flipAmountText"></span>
      </div>
    </div>
  </div>

  <script src="/goal-bar/goal-bar.js?v=20260718_29"></script>
  <script src="/goal-bar/goal-bar-animation.js"></script>
</body>
</html>
