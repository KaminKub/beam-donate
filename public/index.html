  <style>
    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --bg: #0f172a;
      --text: #ffffff;
      --glass: rgba(255, 255, 255, 0.1);
    }
    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .bg-orbs {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -1;
      filter: blur(80px);
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      opacity: 0.5;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -10%; left: -10%; }
    .orb-2 { width: 400px; height: 400px; background: var(--secondary); bottom: -10%; right: -10%; }
    .orb-3 { width: 300px; height: 300px; background: #3b82f6; top: 40%; left: 40%; }

    .landing-container {
      text-align: center;
      width: fit-content;
      padding: 2rem;
      z-index: 1;
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    h1 {
      font-size: 4rem;
      margin-bottom: 1rem;
      background: linear-gradient(to right, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.2s;
      opacity: 0;
    }
    p {
      font-size: 1.2rem;
      color: #94a3b8;
      margin-bottom: 3rem;
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.4s;
      opacity: 0;
    }
    .cta-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.6s;
      opacity: 0;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .btn {
      padding: 1rem 2rem;
      font-size: 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary {
      background: var(--glass);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }
    .btn-secondary:hover {
       background: rgba(255, 255, 255, 0.2);
       transform: translateY(-3px);
     }
     .btn-small {
       padding: 0.5rem 1rem;
       font-size: 0.9rem;
       opacity: 0.7;
     }
     .btn-small:hover {
       opacity: 1;
     }
     .demo-btn-container {
       margin-top: 2rem;
       display: flex;
       justify-content: center;
       animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
       animation-delay: 0.8s;
       opacity: 0;
     }
      .highlight-amount {
       background: linear-gradient(90deg, #4ade80 0%, #ffffff 50%, #4ade80 100%);
       background-size: 200% auto;
       -webkit-background-clip: text;
       background-clip: text;
       -webkit-text-fill-color: transparent;
       font-weight: 800;
       display: inline-block;
       position: relative;
       overflow: hidden;
       width: fit-content;
       animation: shineText 3s linear infinite;
       line-height: 1;
     }
     @keyframes shineText {
       0% { background-position: 200% center; }
       100% { background-position: 0% center; }
     }
   </style>

  <body>


  <div class="bg-orbs">
    <div class="orb orb-1"></div>

  <div class="landing-container">
    <h1><span class="highlight-amount">TipKub</span></h1>
    <p style="font-size: 1rem; margin-top: -1rem; margin-bottom: 2rem;">By <a href="https://www.openlink.co/kaminkub" target="_blank" style="color: #a5b4fc; text-decoration: none;">Kaminkub</a></p>
    <p>แพลตฟอร์มหน้าโดเนทสำเร็จรูป โดย สตรีมเมอร์เพื่อสตรีมเมอร์<br>รับโดเนทผ่านบัญชี Feel Free Pay ของคุณเอง!<br>Beta Test (กำลังพัฒนา)</p>
    
    <div class="cta-group">
      <a href="/register" class="btn btn-primary">
        <i class="fa-solid fa-plus"></i> สร้างหน้าโดเนทส่วนตัว
      </a>
      <a href="/login" class="btn btn-secondary">
        <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ Dashboard
      </a>
    </div>
    <div class="demo-btn-container">
      <a href="/kaminkub" class="btn btn-secondary btn-small" style="width: fit-content;">
        ตัวอย่างหน้าโดเนท
      </a>
    </div>
  </div>

  <footer style="margin-top: auto; padding-bottom: 2rem; width: 100%; text-align: center; z-index: 1; opacity: 0.6; font-size: 0.8rem;">
