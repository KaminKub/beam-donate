  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .bg-orbs {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -1;
      filter: blur(80px);
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      opacity: 0.5;
    }
    .orb-1 { width: 400px; height: 400px; background: #667eea; top: -10%; left: -10%; }
    .orb-2 { width: 400px; height: 400px; background: #764ba2; bottom: -10%; right: -10%; }
    .orb-3 { width: 300px; height: 300px; background: #3b82f6; top: 40%; left: 40%; }

    .login-container {
      text-align: center;
      width: 100%;
      max-width: 550px;
      padding: 2rem;
      z-index: 1;
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 3rem 2rem;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
    }
    .login-card:hover {
      transform: translateY(-5px);
    }
    .login-card h2 {
      margin: 0 0 1rem 0;
      font-size: 2.5rem;
    }
    .login-card h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      font-weight: 500;
      color: #ffffff;
    }
    .login-card p {
      color: #94a3b8;
      margin-bottom: 2rem;
      font-size: 1.1rem;
      line-height: 1.5;
    }

    .tos-container {
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: left;
      font-size: 0.9rem;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
    }
    .tos-container input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .tos-container a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
    }
    .tos-container a:hover {
      text-decoration: underline;
    }

    .btn-twitch {
      background: linear-gradient(135deg, #6441a5, #7d5bbe);
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 20px rgba(100, 65, 165, 0.3);
      font-size: 35px;
      margin-bottom: 15px;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .btn-twitch:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(100, 65, 165, 0.4);
      filter: brightness(1.1);
    }
    .btn-streamlabs {
      background: linear-gradient(135deg, #00cc66, #00ff99);
      color: #0f172a;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 20px rgba(0, 204, 102, 0.3);
      font-size: 1.1rem;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .btn-streamlabs:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(0, 204, 102, 0.4);
      filter: brightness(1.1);
    }

    .btn-disabled {
      filter: grayscale(1) opacity(0.5);
      cursor: not-allowed !important;
      box-shadow: none !important;
    }

    .back-home {
      display: block;
      margin-top: 1.5rem;
      color: #64748b;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
    }
    .back-home:hover {
      color: #94a3b8;
    }

    .highlight-amount {
      background: linear-gradient(90deg, #4ade80 0%, #ffffff 50%, #4ade80 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      display: inline-block;
      position: relative;
      overflow: hidden;
      width: fit-content;
      animation: shineText 3s linear infinite;
      line-height: 1;
    }
    @keyframes shineText {
      0% { background-position: 200% center; }
      100% { background-position: 0% center; }
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <h2><a href="/" style="text-decoration: none; font-size: larger;"><span class="highlight-amount">TipKub</span></a></h2>
      <h1>Register</h1>
      <p>เลือกวิธีสมัคร</p>
      
      <label class="tos-container">
        <input type="checkbox" id="tos-checkbox">
        <span>ฉันยอมรับ <a href="/terms-of-services.html" target="_blank">ข้อตกลงและเงื่อนไข</a> และ <a href="/privacy.html" target="_blank">นโยบายความเป็นส่วนตัว</a></span>
      </label>

      <a href="/auth/register/twitch" class="btn-twitch btn-disabled" id="btnTwitch">
        <i class="fa-brands fa-twitch"></i>
        <span style="font-size: 1.1rem;">สมัครด้วย Twitch</span>
      </a>
      <a href="/auth/register/streamlabs" class="btn-streamlabs btn-disabled" id="btnStreamlabs">
        <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 35px; height: 35px; fill: currentColor;"><title>Streamlabs</title><path d="M8.6878 1.3459a1.365 1.365 0 0 0-.2734.0058c-.528.066-1.0133.1616-1.4843.3086A10.0568 10.0568 0 0 0 .3208 8.2697c-.147.471-.2445.9583-.3105 1.4863-.091.734.431 1.4041 1.166 1.4961.734.091 1.404-.43 1.496-1.164.05-.406.119-.7316.209-1.0196A7.3736 7.3736 0 0 1 7.727 4.221c.288-.09.6145-.157 1.0195-.207.735-.092 1.255-.7631 1.164-1.4981a1.3394 1.3394 0 0 0-1.2226-1.17Zm4.0488 5.2226c-2.629 0-3.9432.0007-4.9472.5117A4.684 4.684 0 0 0 5.7406 9.131c-.512 1.004-.5117 2.3183-.5117 4.9473v4.289c0 1.502-.001 2.2542.291 2.8282.257.505.6679.9149 1.1719 1.1719.574.292 1.326.291 2.828.291h6.9706c2.628 0 3.9442.0012 4.9472-.5098a4.6883 4.6883 0 0 0 2.0507-2.0508c.512-1.004.5117-2.3182.5117-4.9472v-1.0723c0-2.629.0003-3.9433-.5117-4.9473a4.6883 4.6883 0 0 0-2.0507-2.0508c-1.003-.511-2.3193-.5117-4.9472-.5117zm.537 6.7051c.741 0 1.3399.5998 1.3399 1.3398v2.6836c0 .74-.5988 1.3399-1.3398 1.3399-.74 0-1.3418-.5999-1.3418-1.3399v-2.6836c0-.74.6018-1.3398 1.3418-1.3398zm5.3632 0c.74 0 1.3399.5998 1.3399 1.3398v2.6836c0 .74-.5999 1.3399-1.3399 1.3399-.741 0-1.3398-.5999-1.3398-1.3399v-2.6836c0-.74.5989-1.3398 1.3398-1.3398z"/></svg>
        <span>สมัครด้วย Streamlabs</span>
      </a>
      
      <a href="/" class="back-home">← ย้อนกลับไปหน้าหลัก</a>
    </div>
  </div>

  <script>
    const checkbox = document.getElementById('tos-checkbox');
    const btnTwitch = document.getElementById('btnTwitch');
    const btnStreamlabs = document.getElementById('btnStreamlabs');

    function toggleButtons() {
      if (checkbox.checked) {
        btnTwitch.classList.remove('btn-disabled');
        btnTwitch.style.pointerEvents = 'auto';
        
        // Keep Streamlabs disabled
        btnStreamlabs.classList.add('btn-disabled');
        btnStreamlabs.style.pointerEvents = 'none';
      } else {
        btnTwitch.classList.add('btn-disabled');
        btnStreamlabs.classList.add('btn-disabled');
        btnTwitch.style.pointerEvents = 'none';
        btnStreamlabs.style.pointerEvents = 'none';
      }
    }

    checkbox.addEventListener('change', toggleButtons);
    
    // Initial state
    toggleButtons();
  </script>
  <script src="cookie-consent.js"></script>
</body>
</html>
