<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Twitter / X -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://tipkub.me/">
  <meta property="twitter:title" content="TipKub | สร้างหน้าโดเนทส่วนตัว ✨">
  <meta property="twitter:description" content="สร้างหน้าโดเนทแบบเรียบง่ายสำหรับสตรีมเมอร์ พร้อมระบบ Alert แจ้งเตือนบนจอแบบ Real-time ให้ทุกการสนับสนุนมีความหมาย">
  <meta property="twitter:image" content="https://tipkub.me/banner.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .bg-orbs {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -1;
      filter: blur(80px);
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      opacity: 0.5;
    }
    .orb-1 { width: 400px; height: 400px; background: #667eea; top: -10%; left: -10%; }
    .orb-2 { width: 400px; height: 400px; background: #764ba2; bottom: -10%; right: -10%; }
    .orb-3 { width: 300px; height: 300px; background: #3b82f6; top: 40%; left: 40%; }

    .login-container {
      text-align: center;
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      z-index: 1;
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 3rem 2rem;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
    }
    .login-card:hover {
      transform: translateY(-5px);
    }
    .login-card h2 {
      margin: 0 0 1rem 0;
      font-size: 2.5rem;
    }
    .login-card h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      font-weight: 500;
      color: #ffffff;
    }
    .login-card p {
      color: #94a3b8;
      margin-bottom: 2.5rem;
      font-size: 1.1rem;
      line-height: 1.5;
    }
    .btn-twitch {
      background: linear-gradient(135deg, #6441a5, #7d5bbe);
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 20px rgba(100, 65, 165, 0.3);
      font-size: 1.1rem;
    }
    .btn-twitch:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(100, 65, 165, 0.4);
      filter: brightness(1.1);
    }
    .highlight-amount {
      background: linear-gradient(90deg, #4ade80 0%, #ffffff 50%, #4ade80 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      display: inline-block;
      position: relative;
      overflow: hidden;
      width: fit-content;
      animation: shineText 3s linear infinite;
      line-height: 1;
    }
    @keyframes shineText {
      0% { background-position: 200% center; }
      100% { background-position: 0% center; }
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <h2><a href="/" style="text-decoration: none; font-size: larger;"><span class="highlight-amount">TipKub</span></a></h2>
      <h1>Dashboard Access</h1>
      <p>เข้าสู่ระบบเพื่อจัดการหน้า DashBoard</p>
      <a href="/auth/twitch" class="btn-twitch">
        <i class="fa-brands fa-twitch"></i>
        <span>Login with Twitch</span>
      </a>
    </div>
  </div>

  <script src="cookie-consent.js"></script>
</body>
</html>
